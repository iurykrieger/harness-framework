cost:
  class: cheap
  compute:
    cpu: medium
    memory_mb: 512
  latency:
    p50_ms: 5000
    p95_ms: 30000
    timeout_ms: 120000
description: On pull-request, runs `go test -race -count=1 -tags=catalog_sensors -v
  ./skills/create-sensors/scripts/...` and emits one Signal per test case. Validates
  create-sensor's catalog-sensors script — the JSONL digest stream produced by walking
  lib/sensor.Catalog and ordering by sensor id. Output is stream because the testing
  component emits one `--- PASS:` / `--- FAIL:` / `--- SKIP:` line per test (log_shape
  go-test-verbose). Regulates behaviour.
determinism: high
execution:
  command: go test -race -count=1 -tags=catalog_sensors -v ./skills/create-sensors/scripts/...
    2>&1
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
      regex: ^\s*--- FAIL:\s+(\S+)
      severity: high
      verdict: fail
    - captures:
        excerpt: 1
      regex: ^\s*--- SKIP:\s+(\S+)
      severity: low
      verdict: warn
    - captures:
        excerpt: 1
      regex: ^\s*--- PASS:\s+(\S+)
      severity: info
      verdict: pass
id: unit-test-create-sensor-catalog-sensors
kind: assertion
name: Unit tests — create-sensor catalog-sensors script
output: stream
phase: pre-merge
regulation: behaviour
triggers:
- "on": pull-request
- "on": agent-request
type: computational
use_cases:
- create-sensor-catalog-list
version: 0.1.0
