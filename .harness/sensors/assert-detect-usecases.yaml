cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 256
  latency:
    p50_ms: 5000
    p95_ms: 60000
    timeout_ms: 180000
description: Validates the detect-usecases journey by running the canonical write-usecase
  and lib/usecase tests that exercise each business rule of the five detect-usecases
  use cases (success, schema-fail, stack-missing, journey-orphan, evidence-missing).
  Emits one Signal per shell step plus the aggregate. Regulates behaviour.
determinism: high
execution:
  steps:
  - exit_code_map:
      '*': fail
      "0": pass
    id: rule-1-evidence-row-must-point-at-real-file
    parse:
      patterns:
      - captures:
          excerpt: 1
        regex: ^\s*--- FAIL:\s+(\S+)
        severity: high
        verdict: fail
      - captures:
          excerpt: 1
        regex: ^\s*--- SKIP:\s+(\S+)
        severity: low
        verdict: warn
      - captures:
          excerpt: 1
        regex: ^\s*--- PASS:\s+(\S+)
        severity: info
        verdict: pass
    run: go test -count=1 -tags=write_usecase -run '^TestRun_EvidenceMissing$' ./skills/detect-usecases/scripts/...
      2>&1
    type: shell
  - exit_code_map:
      '*': fail
      "0": pass
