cost:
  class: medium
  compute:
    cpu: medium
    memory_mb: 1024
  latency:
    p50_ms: 5000
    p95_ms: 30000
    timeout_ms: 180000
description: On every pull request, runs the detect-sensors test suite under the replay_fixture
  build tag with -race -count=1 -v; regulates behaviour of the replay-fixture script
  (the verifier that replays golden_cases through the orchestrator). Output is stream
  — one Signal per --- PASS|FAIL|SKIP line plus a final aggregate. Auto-detected via
  /detect-sensors from .github/workflows/test.yml step "Test replay-fixture". output_parsing
  patterns derived from log_shape 'go-test-verbose' in .harness/stack.json.
determinism: high
execution:
  command: go test -race -count=1 -v -tags=replay_fixture ./skills/detect-sensors/scripts/...
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
      regex: '^\s*--- PASS: (\S+)'
      severity: info
      verdict: pass
    - captures:
        excerpt: 1
      regex: '^\s*--- FAIL: (\S+)'
      severity: high
      verdict: fail
    - captures:
        excerpt: 1
      regex: '^\s*--- SKIP: (\S+)'
      severity: low
      verdict: warn
id: unit-test-replay-fixture
kind: assertion
name: Unit tests (replay-fixture)
output: stream
phase: pre-merge
references:
- Auto-generated by /detect-sensors on 2026-05-14
- .github/workflows/test.yml step "Test replay-fixture"
regulation: behaviour
triggers:
- "on": pull-request
type: computational
verification:
  golden_cases:
  - expected_severity: info
    expected_verdict: pass
    fixture: sensors/fixtures/unit-test/all-pass.txt
    notes: Shared unit-test fixture; go-test-verbose shape is build-tag-agnostic.
  - expected_severity: high
    expected_verdict: fail
    fixture: sensors/fixtures/unit-test/has-failure.txt
    notes: Stream contains one --- FAIL; aggregate fail/high.
  - expected_severity: low
    expected_verdict: warn
    fixture: sensors/fixtures/unit-test/has-skip.txt
    notes: Stream contains one --- SKIP; aggregate warn/low.
version: 0.1.0
