cost:
  class: cheap
  compute:
    cpu: medium
    memory_mb: 512
  latency:
    p50_ms: 5000
    p95_ms: 30000
    timeout_ms: 120000
description: On pull-request, runs `go test -race -count=1 -tags=write_fixture -v
  ./skills/create-sensor/scripts/...` and emits one Signal per test case. Validates
  create-sensor's write-fixture script — the atomic tmp+rename writer that persists
  fixture payloads under <projectRoot>/.harness/fixtures/ while rejecting path-escape
  traversal. Output is stream because the testing component emits one `--- PASS:`
  / `--- FAIL:` / `--- SKIP:` line per test (log_shape go-test-verbose). Regulates
  behaviour.
determinism: high
execution:
  command: go test -race -count=1 -tags=write_fixture -v ./skills/create-sensor/scripts/...
    2>&1
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
      regex: ^\s*--- FAIL:\s+(\S+)
      severity: high
      verdict: fail
    - captures:
        excerpt: 1
      regex: ^\s*--- SKIP:\s+(\S+)
      severity: low
      verdict: warn
    - captures:
        excerpt: 1
      regex: ^\s*--- PASS:\s+(\S+)
      severity: info
      verdict: pass
id: unit-test-create-sensor-write-fixture
kind: assertion
name: Unit tests — create-sensor write-fixture script
output: stream
phase: pre-merge
regulation: behaviour
triggers:
- "on": pull-request
- "on": agent-request
type: computational
use_cases:
- create-sensor-fixture-path-escape
- create-sensor-fixture-written
version: 0.1.0
