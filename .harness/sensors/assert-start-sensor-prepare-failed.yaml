cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 128
  latency:
    p50_ms: 3000
    p95_ms: 12000
    timeout_ms: 60000
description: |
  Builds a fixture blocking sensor whose requires[kind=step] first step
  exits non-zero (`exit 1`), invokes /start-sensor against an isolated
  temp registry, and asserts the failure shape declared by the
  start-sensor-prepare-failed usecase: exit code 1, last JSONL line
  carries verdict=error, metadata.kind=failed, metadata.cause=
  prepare_failed, and metadata.lifecycle.prepare records the failing
  step (one entry, verdict=fail). Sensor's main command MUST NOT have
  spawned (no registry entry, no run-id log dir). Validates
  orchestrator.RunPreparePhase at start.go:154-164.
determinism: high
execution:
  env:
    HARNESS_AUTOFILE_ISSUES: "0"
  steps:
  - exit_code_map:
      '*': fail
      "0": pass
    id: setup-tmp-registry
    outputs:
      tmpdir:
        from: stdout
        trim: true
    run: |
      set -eu
      tmpdir=$(mktemp -d -t harness-assert-prepare-failed.XXXXXX)
      mkdir -p "$tmpdir/.harness/sensors" "$tmpdir/.harness/usecases"
      cp -R .harness/usecases/. "$tmpdir/.harness/usecases/"
      printf '%s' "$tmpdir"
    type: shell
  - exit_code_map:
      '*': fail
      "0": pass
    id: persist-fixture-with-failing-prepare
    run: |
      set -eu
      tmpdir='${{ steps.setup-tmp-registry.outputs.tmpdir }}'
      draft="$tmpdir/fixture-draft.yaml"
      cat >"$draft" <<'YAML'
      id: fixture-blocking-prepare-fails
      version: 0.1.0
      name: Fixture blocking sensor with a failing prepare step
      description: |
        Synthetic blocking sensor whose first requires[kind=step] entry
        exits 1, so the prepare phase aborts fail-fast before the main
        command is spawned. Used by assert-start-sensor-prepare-failed.
      kind: assertion
      type: computational
      regulation: behaviour
      phase: on-demand
      determinism: high
      output: stream
      cost:
        class: cheap
        compute:
          cpu: low
          memory_mb: 16
        latency:
          p50_ms: 5
          p95_ms: 50
      triggers:
      - "on": manual
      use_cases:
      - start-sensor-prepare-failed
      requires:
      - kind: step
        command: exit 1
      - kind: step
        command: echo should-not-run
      execution:
        blocking: true
        graceful_timeout_ms: 2000
        command: printf 'ready\n' && sleep 60
        exit_code_map:
        - exit_code: 0
          severity: info
          verdict: pass
        - exit_code: '*'
          severity: high
          verdict: fail
        output_parsing:
          patterns:
          - regex: '.*'
            verdict: pass
            severity: info
      YAML
      HARNESS_REGISTRY_ROOT="$tmpdir" GOWORK=off \
        go run -C "$CLAUDE_PLUGIN_ROOT" -tags=write_sensor \
        ./skills/create-sensor/scripts \
        --out "$tmpdir/.harness/sensors" \
        --schemas-dir "$CLAUDE_PLUGIN_ROOT/schemas" \
        "$draft" >/dev/null
    type: shell
  - exit_code_map:
      '*': pass
      "0": pass
    id: start-with-failing-prepare
    outputs:
      exit_code:
        from: stdout
        trim: true
    run: |
      set -u
      tmpdir='${{ steps.setup-tmp-registry.outputs.tmpdir }}'
      out="$tmpdir/start.out"
      err="$tmpdir/start.err"
      HARNESS_REGISTRY_ROOT="$tmpdir" GOWORK=off CLAUDE_PLUGIN_ROOT="$CLAUDE_PLUGIN_ROOT" \
        go run -C "$CLAUDE_PLUGIN_ROOT" -tags=start_sensor \
        ./skills/start-sensor/scripts fixture-blocking-prepare-fails \
        >"$out" 2>"$err"
      rc=$?
      printf '%s' "$rc"
    type: shell
  - expect:
      equals: "1"
      value: ${{ steps.start-with-failing-prepare.outputs.exit_code }}
    id: assert-exit-code-is-1
    type: assert
  - exit_code_map:
      '*': fail
      "0": pass
    id: assert-prepare-failed-shape
    run: |
      set -eu
      tmpdir='${{ steps.setup-tmp-registry.outputs.tmpdir }}'
      out="$tmpdir/start.out"
      if [ ! -s "$out" ]; then
        echo "expected non-empty stdout capture at $out" >&2
        exit 1
      fi
      last=$(tail -n 1 "$out")
      verdict=$(printf '%s' "$last" | jq -r '.verdict // ""')
      kind=$(printf '%s' "$last" | jq -r '.metadata.kind // ""')
      cause=$(printf '%s' "$last" | jq -r '.metadata.cause // ""')
      prep_count=$(printf '%s' "$last" | jq -r '.metadata.lifecycle.prepare | length // 0')
      first_verdict=$(printf '%s' "$last" | jq -r '.metadata.lifecycle.prepare[0].verdict // ""')
      first_exit=$(printf '%s' "$last" | jq -r '.metadata.lifecycle.prepare[0].exit_code // -1')
      if [ "$verdict" != "error" ]; then
        echo "expected verdict=error, got=$verdict last=$last" >&2; exit 1
      fi
      if [ "$kind" != "failed" ]; then
        echo "expected metadata.kind=failed, got=$kind last=$last" >&2; exit 1
      fi
      if [ "$cause" != "prepare_failed" ]; then
        echo "expected metadata.cause=prepare_failed, got=$cause last=$last" >&2; exit 1
      fi
      if [ "$prep_count" != "1" ]; then
        echo "expected exactly 1 prepare entry (fail-fast cut-off), got=$prep_count last=$last" >&2; exit 1
      fi
      if [ "$first_verdict" = "pass" ]; then
        echo "expected first prepare verdict != pass, got=$first_verdict" >&2; exit 1
      fi
      if [ "$first_exit" = "0" ]; then
        echo "expected first prepare exit_code != 0, got=$first_exit" >&2; exit 1
      fi
      registry="$tmpdir/.harness/runtime/running_sensors.json"
      if [ -f "$registry" ]; then
        count=$(jq '[.entries[] | select(.sensor_id == "fixture-blocking-prepare-fails")] | length' "$registry" 2>/dev/null || echo 0)
        if [ "$count" != "0" ]; then
          echo "expected no registry entries for fixture, got=$count" >&2; cat "$registry" >&2; exit 1
        fi
      fi
      echo "prepare-failed shape OK verdict=$verdict cause=$cause prepare_entries=$prep_count first_verdict=$first_verdict"
    type: shell
  teardown:
  - command: |
      set -u
      for d in /tmp/harness-assert-prepare-failed.* "${TMPDIR:-/tmp}"/harness-assert-prepare-failed.*; do
        [ -d "$d" ] || continue
        rm -rf "$d"
      done
      exit 0
id: assert-start-sensor-prepare-failed
kind: assertion
name: Assert start-sensor refuses to start when prepare fails fail-fast
output: single
phase: on-demand
regulation: behaviour
triggers:
- "on": manual
- "on": agent-request
type: computational
use_cases:
- start-sensor-prepare-failed
version: 0.1.0
