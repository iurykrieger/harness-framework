id: smoke-with-setup
version: 0.1.0
name: smoke-with-setup
description: Composes smoke-http-roundtrip via a type:sensor step to exercise inline composition.
kind: assertion
type: computational
regulation: behaviour
phase: on-demand
determinism: high
output: single
cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 64
  latency:
    p50_ms: 100
    p95_ms: 1000
    timeout_ms: 10000
blind_spots:
  - Inherits every blind spot of smoke-http-roundtrip; adds no new coverage on its own.
triggers:
  - "on": manual
verification:
  golden_cases:
    - fixture: order-valid.json
      expected_verdict: error
      expected_severity: critical
      notes: |
        Verdict propagates from the inner smoke-http-roundtrip run.
        With no server on http://localhost:8080 the inner http step
        errors, the inner aggregate is error, and the outer aggregate
        folds to the same verdict.
execution:
  steps:
    - id: run-smoke
      type: sensor
      ref: smoke-http-roundtrip
      outputs_passthrough: true
