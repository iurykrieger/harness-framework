id: smoke-typed-pipeline
version: 0.1.0
name: smoke-typed-pipeline
description: Loads a fixture via a shell step, captures its content as a declared output, and asserts the shape from a downstream step.
kind: assertion
type: computational
regulation: behaviour
phase: on-demand
determinism: high
output: single
cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 64
  latency:
    p50_ms: 50
    p95_ms: 500
    timeout_ms: 5000
blind_spots:
  - Validates the fixture content via a substring match only; deeper schema validation is out of scope.
triggers:
  - "on": manual
use_cases:
  - framework-smoke-typed-pipeline
execution:
  steps:
    - id: load-fixture
      type: shell
      with:
        order:
          fixture: framework/framework-smoke-typed-pipeline/trigger.json
      run: |
        test -f "$HARNESS_FIXTURE_PATH"
        cat "$HARNESS_FIXTURE_PATH"
      exit_code_map:
        "0": pass
        "1": fail
      outputs:
        payload:
          from: stdout
    - id: validate-payload-shape
      type: assert
      expect:
        value: "${{ steps.load-fixture.outputs.payload }}"
        contains: "sku"
