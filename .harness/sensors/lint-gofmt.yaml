blind_spots:
- gofmt -l does not propagate non-zero on findings — sensor verdict is entirely pattern-driven;
  an exit-1 here means an internal gofmt error, not a formatting violation.
- Not enforced by .github/workflows/test.yml; this sensor adds a hygiene check that
  CI does not currently run.
cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 256
  latency:
    p50_ms: 1000
    p95_ms: 5000
    timeout_ms: 60000
description: On any change touching Go sources, runs gofmt -l . to list files whose
  formatting drifts from canonical Go style; regulates maintainability. Output is
  stream — one Signal per unformatted file (gofmt -l prints exactly one path per line
  and exits 0 regardless of findings, so the verdict is fully pattern-driven). Auto-detected
  via /detect-sensors from the presence of go.mod.
determinism: high
execution:
  command: gofmt -l .
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: error
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
        file: 1
      regex: ^(\S+\.go)$
      severity: medium
      verdict: fail
id: lint-gofmt
kind: assertion
name: gofmt formatting
output: stream
phase: pre-commit
references:
- Auto-generated by /detect-sensors on 2026-05-08; not in CI today.
- 'https://pkg.go.dev/cmd/gofmt — ''-l: list files whose formatting differs from gofmt''s'''
regulation: maintainability
triggers:
- "on": file-change
  when: diff touches **/*.go
- "on": pull-request
type: computational
verification:
  golden_cases:
  - expected_severity: info
    expected_verdict: pass
    fixture: sensors/fixtures/lint-gofmt/clean.txt
    notes: gofmt -l on a fully-formatted tree prints nothing, exits 0 — stream empty
      + exit_code_map[0] = pass/info.
  - expected_severity: medium
    expected_verdict: fail
    fixture: sensors/fixtures/lint-gofmt/has-unformatted.txt
    notes: Two unformatted Go file paths printed one per line. Each matches the pattern
      → fail/medium individuals; aggregate worst-of-two = fail/medium even though
      gofmt's exit code is still 0.
version: 0.1.0
