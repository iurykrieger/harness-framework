cost:
  class: cheap
  compute:
    cpu: medium
    memory_mb: 512
  latency:
    p50_ms: 5000
    p95_ms: 30000
    timeout_ms: 120000
description: On pull-request, runs `go test -race -count=1 -tags=plan_sensors -v ./skills/create-sensor/scripts/...`
  and emits one Signal per test case. Auto-detected from .github/workflows/test.yml
  step "Test plan-sensors". Output is stream because the testing component emits one
  `--- PASS:` / `--- FAIL:` / `--- SKIP:` line per test (log_shape go-test-verbose).
  Regulates behaviour.
determinism: high
execution:
  command: go test -race -count=1 -tags=plan_sensors -v ./skills/create-sensor/scripts/...
    2>&1
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
      regex: ^\s*--- FAIL:\s+(\S+)
      severity: high
      verdict: fail
    - captures:
        excerpt: 1
      regex: ^\s*--- SKIP:\s+(\S+)
      severity: low
      verdict: warn
    - captures:
        excerpt: 1
      regex: ^\s*--- PASS:\s+(\S+)
      severity: info
      verdict: pass
id: unit-test-plan-sensors
kind: assertion
name: Unit tests — plan-sensors script
output: stream
phase: pre-merge
regulation: behaviour
triggers:
- "on": pull-request
- "on": agent-request
type: computational
use_cases:
- create-sensor-plan-from-ledger
- create-sensor-success
version: 0.1.0
