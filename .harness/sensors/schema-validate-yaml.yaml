blind_spots:
- Only checks YAML parseability, not Draft 2020-12 structural conformance (lib/schema/validator_test.go
  covers that via Go).
- Requires yq in PATH; CI ubuntu-latest has it preinstalled — local devs without yq
  see verdict=error rather than fail.
cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 128
  latency:
    p50_ms: 500
    p95_ms: 3000
    timeout_ms: 30000
description: On any change touching schemas/, parses schemas/{signal,sensor,stack,usecase}.yaml
  with yq to confirm all four files are syntactically valid YAML; regulates maintainability.
  Output is single because the yq check is binary — exit 0 means all files parse,
  anything else means one is malformed and the yq error is in stderr. Auto-detected
  via /detect-sensors from .github/workflows/test.yml.
determinism: high
execution:
  command: yq -e '.title' schemas/sensor.yaml > /dev/null && yq -e '.title' schemas/signal.yaml
    > /dev/null && yq -e '.title' schemas/stack.yaml > /dev/null && yq -e '.title'
    schemas/usecase.yaml > /dev/null
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
id: schema-validate-yaml
kind: assertion
name: Schema files parse as YAML
output: single
phase: pre-commit
references:
- Auto-generated by /detect-sensors on 2026-05-08
- .github/workflows/test.yml step "Verify schemas parse as YAML"
regulation: maintainability
triggers:
- "on": file-change
  when: diff touches schemas/**
- "on": pull-request
type: computational
verification:
  golden_cases:
  - expected_severity: info
    expected_verdict: pass
    fixture: sensors/fixtures/schema-validate-yaml/valid.yaml
    notes: yq on a well-formed YAML file exits 0 → exit_code_map[0] = pass/info.
  - expected_severity: high
    expected_verdict: fail
    fixture: sensors/fixtures/schema-validate-yaml/broken.yaml
    notes: Unterminated flow array → yq exits non-zero → exit_code_map['*'] = fail/high.
version: 0.2.0
