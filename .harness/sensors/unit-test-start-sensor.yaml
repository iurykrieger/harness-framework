cost:
  class: medium
  compute:
    cpu: medium
    memory_mb: 1024
  latency:
    p50_ms: 10000
    p95_ms: 60000
    timeout_ms: 300000
description: On pull-request, runs `go test -race -count=1 -tags=start_sensor -v ./skills/...`
  and emits one Signal per test case. Derived from .harness/stack.yaml log_shape go-test-verbose.
  Output is stream because the testing component emits one `--- PASS:` / `--- FAIL:`
  / `--- SKIP:` line per test. Regulates behaviour.
determinism: high
execution:
  command: go test -race -count=1 -tags=start_sensor -v ./skills/... 2>&1
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: high
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 1
      regex: ^\s*--- FAIL:\s+(\S+)
      severity: high
      verdict: fail
    - captures:
        excerpt: 1
      regex: ^\s*--- SKIP:\s+(\S+)
      severity: low
      verdict: warn
    - captures:
        excerpt: 1
      regex: ^\s*--- PASS:\s+(\S+)
      severity: info
      verdict: pass
id: unit-test-start-sensor
kind: assertion
name: Unit tests — start-sensor
output: stream
phase: pre-merge
regulation: behaviour
triggers:
- "on": pull-request
- "on": agent-request
type: computational
use_cases:
- start-sensor-success-started
- start-sensor-already-running
version: 0.1.0
