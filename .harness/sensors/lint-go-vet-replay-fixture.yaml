cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 512
  latency:
    p50_ms: 3000
    p95_ms: 15000
    timeout_ms: 120000
description: 'On every pull request, runs go vet across all packages with the replay_fixture
  build tag; regulates maintainability of the replay-fixture detect-sensors script
  (the verifier used to replay golden_cases through the orchestrator). Output is stream
  because each finding (file:line:col: message) is independently actionable. Auto-detected
  via /detect-sensors from .github/workflows/test.yml step "Vet (replay_fixture build
  tag)". output_parsing patterns derived from log_shape ''go-compiler-diagnostic''
  in .harness/stack.json.'
determinism: high
execution:
  command: go vet -tags=replay_fixture ./...
  exit_code_map:
  - exit_code: 0
    severity: info
    verdict: pass
  - exit_code: '*'
    severity: medium
    verdict: fail
  output_parsing:
    patterns:
    - captures:
        excerpt: 4
        file: 1
        line_start: 2
      regex: ^\s*(\S+\.go):(\d+):(\d+):\s+(.+)$
      severity: medium
      verdict: fail
id: lint-go-vet-replay-fixture
kind: assertion
name: go vet (replay_fixture)
output: stream
phase: pre-merge
references:
- Auto-generated by /detect-sensors on 2026-05-14
- .github/workflows/test.yml step "Vet (replay_fixture build tag)"
regulation: maintainability
triggers:
- "on": pull-request
type: computational
verification:
  golden_cases:
  - expected_severity: info
    expected_verdict: pass
    fixture: sensors/fixtures/lint-go-vet/clean.txt
    notes: Empty stdout + exit 0 — clean repo. Shared fixture across all lint-go-vet-*
      sensors.
  - expected_severity: medium
    expected_verdict: fail
    fixture: sensors/fixtures/lint-go-vet/has-warning.txt
    notes: Two synthetic vet findings — same shape regardless of build tag.
version: 0.1.0
