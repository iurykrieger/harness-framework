id: smoke-http-roundtrip
version: 0.1.0
name: smoke-http-roundtrip
description: Loads an order fixture, validates its shape, and posts it to the orders endpoint.
kind: assertion
type: computational
regulation: behaviour
phase: on-demand
determinism: high
output: single
cost:
  class: cheap
  compute:
    cpu: low
    memory_mb: 64
  latency:
    p50_ms: 50
    p95_ms: 500
    timeout_ms: 5000
blind_spots:
  - Does not exercise authentication or rate limiting on the orders endpoint.
  - Treats any non-2xx response identically; does not distinguish 4xx from 5xx.
triggers:
  - "on": manual
verification:
  golden_cases:
    - fixture: order-valid.json
      expected_verdict: error
      expected_severity: critical
      notes: |
        CI has no server on http://localhost:8080, so the http step
        hits ECONNREFUSED. That is the legitimate acceptance signal
        for the framework's network-unreachable path: verdict=error,
        severity=critical. When run against a real backend the
        expected verdict would be pass.
execution:
  steps:
    - id: load-fixture
      type: shell
      with:
        order:
          fixture: order-valid.json
      run: |
        test -f "$HARNESS_FIXTURE_PATH"
        cat "$HARNESS_FIXTURE_PATH"
      exit_code_map:
        "0": pass
        "1": fail
      outputs:
        payload:
          from: stdout
    - id: validate-payload-shape
      type: assert
      expect:
        value: "${{ steps.load-fixture.outputs.payload }}"
        contains: "sku"
    - id: try-create
      type: http
      method: POST
      url: http://localhost:8080/orders
      headers:
        content-type: application/json
      body_from:
        fixture: order-valid.json
      expect:
        status:
          equals: 201
