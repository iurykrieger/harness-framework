behavior:
  business_rules:
  - A missing registry file makes the request unsatisfiable.
  - 'Verdict mapping per CLAUDE.md: /stop-sensor is error when registry is absent.'
  - The rationale guides the agent toward HARNESS_REGISTRY_ROOT remediation.
  summary: |
    cli.Bootstrap detects b.Res.Exists=false. runStop inspects this flag and
    emits an error/stop_no_registry Signal with a rationale explaining
    likely causes (wrong cwd, HARNESS_REGISTRY_ROOT misconfigured), then
    returns exit code 1.
description: |
  When .harness/runtime/running_sensors.json does not exist on disk, no
  sensor can be running and /stop-sensor cannot satisfy the request.
  runStop emits a Signal verdict=error, metadata.kind=stop_no_registry with
  rationale pointing the user at HARNESS_REGISTRY_ROOT or the original cwd.
  Exit code is 1. (Per CLAUDE.md the four registry-touching skills assign
  different verdicts when registry is absent — /stop-sensor's is "error".)
evidence:
- file: skills/stop-sensor/scripts/stop.go
  kind: implementation
  line_end: 76
  line_start: 67
  rationale: stop_no_registry emission path when b.Res.Exists is false.
- file: lib/registry/root.go
  kind: contract
  rationale: registry.Lookup walk-up and HARNESS_REGISTRY_ROOT resolution contract
    that defines b.Res.Exists.
expected_outcome:
  fixture:
    ref: stop-sensor/stop-sensor-registry-not-found/outcome.json
  invariants:
  - metadata.kind == "stop_no_registry".
  - Exit code is 1.
  - metadata.registry_exists is false (diagnose block).
  shape: signal-jsonl
  side_effects: []
  summary: Signal verdict=error, metadata.kind=stop_no_registry; exit 1.
id: stop-sensor-registry-not-found
journey_id: stop-sensor
name: Stop with no registry file surfaces an error
regression_priority: high
tags:
- error-handling
- framework-stop-sensor
trigger:
  fixture:
    ref: stop-sensor/stop-sensor-registry-not-found/trigger.json
  shape: cli-argv
  summary: Invoke stop-sensor when .harness/runtime/running_sensors.json does not
    exist.
version: 0.1.0
