behavior:
  business_rules:
  - Missing-argument is exit code 2 (usage class).
  - Verdict is warn (not error) because no real state was checked.
  - metadata.kind == "not_running" with rationale "missing sensor id".
  summary: |
    runStop checks len(args) < 1 first; on miss, it builds a warn/not_running
    Signal carrying the missing-id rationale, validates it, and returns exit
    code 2.
description: |
  Calling /stop-sensor with no positional argument is treated as a soft
  no-op: runStop emits a Signal verdict=warn, metadata.kind=not_running
  with rationale "missing sensor id" and returns exit code 2. The registry
  is not touched. This matches the project rule that /stop-sensor is
  idempotent — stopping a non-running sensor MUST NOT error in
  registry-state terms, but the missing-argument variant signals warn so
  the agent can correct its call.
