behavior:
  business_rules:
  - Stopping an absent sensor is not an error.
  - Verdict is warn (advisory) not error.
  - Exit code is 0 (idempotent success).
  summary: |
    Inside the registry file lock, FindEntries returns an empty list.
    runStop bails out cleanly, emitting kind=not_running with verdict=warn
    and exit code 0 — the operation succeeded in its idempotent contract.
description: |
  /stop-sensor on an id that has no entry in the registry returns
  verdict=warn, metadata.kind=not_running, exit code 0. The skill is
  idempotent — stopping a non-running sensor is not an error.
evidence:
- file: skills/stop-sensor/scripts/stop.go
  line_start: 159
  rationale: Idempotent not_running branch after the locked search returns no entry.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_lines:
    - '{"sensor_id":"dev-server","verdict":"warn","severity":"low","evidence":[],"cost_actual":{"latency_ms":3},"metadata":{"kind":"not_running"}}'
  invariants:
  - Exit code is 0.
  - verdict is "warn".
  - metadata.kind is "not_running".
  shape: One JSON line on stdout + exit code
  side_effects:
  - None — registry is unchanged.
  summary: One Signal on stdout, verdict=warn, metadata.kind=not_running, exit code
    0.
id: stop-sensor-not-running-idempotent
journey_id: stop-sensor
name: /stop-sensor on a sensor with no live entry returns warn (idempotent success)
regression_priority: high
tags:
