behavior:
  business_rules:
  - Stopping a sensor that is not running MUST be idempotent (exit 0).
  - verdict is warn (not error) because state is consistent.
  - metadata.kind == "not_running".
  summary: |
    Inside the file lock, FindEntries(sensorID) returns empty. runStop
    releases the lock and emits a warn/not_running Signal with rationale
    "no live entry for ..." then returns exit 0.
description: |
  When the registry file exists but contains no entry for the requested
  sensor id (no live run), /stop-sensor returns exit code 0 and a Signal
  verdict=warn, metadata.kind=not_running. This is the idempotency
  contract: stopping something that is not running succeeds with an
  advisory warn, so the agent can safely retry /stop-sensor in cleanup.
evidence:
- file: skills/stop-sensor/scripts/stop.go
  kind: implementation
  line_end: 172
  line_start: 159
  rationale: not_running emission path when FindEntries returns nothing for the requested
    sensor id.
- file: lib/registry/state.go
  kind: contract
  rationale: RunningSensorState.FindEntries / FindEntryByRunID contract used by the
    entry resolution.
expected_outcome:
  fixture:
    metadata:
      kind: not_running
    sensor_id: serve-app-blocking
    severity: low
    verdict: warn
  invariants:
  - Exit code is 0.
  - metadata.kind == "not_running".
  - The registry file is untouched.
  shape: signal-jsonl
  side_effects: []
  summary: Signal verdict=warn, metadata.kind=not_running; exit 0.
id: stop-sensor-not-running-idempotent
journey_id: stop-sensor
name: Stop a sensor with no live registry entry returns warn idempotently
regression_priority: high
tags:
- idempotent
- framework-stop-sensor
trigger:
  fixture:
    argv:
    - stop-sensor
    - serve-app-blocking
    registry_state:
      entries: []
      file_exists: true
  shape: cli-argv
  summary: Invoke stop-sensor for a sensor id that has no entry in running_sensors.json.
version: 0.1.0
