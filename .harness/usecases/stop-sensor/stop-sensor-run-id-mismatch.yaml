behavior:
  business_rules:
  - run_id is globally unique across sensors, but an agent can mismatch them.
  - The mismatch is detected before any kill / hold removal happens.
  - Exit code is 1.
  summary: |
    Under the lock, FindEntryByRunID returns the entry; runStop notes
    entry.SensorID != requested sensorID and returns a typed mismatchErr.
    After the lock releases, the wrapper emits the run_id_sensor_mismatch
    Signal and returns exit 1.
description: |
  When the caller passes `<sensorID>/<runID>` and the registry has an entry
  for runID but entry.SensorID != sensorID, runStop refuses with verdict=
  error, metadata.kind=run_id_sensor_mismatch and exit 1. This guards
  against agents pasting a run_id from a different sensor's log.
evidence:
- file: skills/stop-sensor/scripts/stop.go
  kind: implementation
  line_end: 100
  line_start: 90
  rationale: mismatchErr construction site that detects run_id/sensor_id divergence
    under the lock.
- file: skills/stop-sensor/scripts/stop.go
  kind: implementation
  line_end: 145
  line_start: 137
  rationale: Wrapper that emits the run_id_sensor_mismatch Signal after the lock releases.
- file: lib/registry/state.go
  kind: contract
  rationale: FindEntryByRunID lookup contract that produces the entry consulted for
    the mismatch check.
expected_outcome:
  fixture:
    metadata:
      kind: run_id_sensor_mismatch
    sensor_id: serve-app-blocking
    severity: high
    verdict: error
  invariants:
  - metadata.kind == "run_id_sensor_mismatch".
  - Exit code is 1.
  - No process is signaled, no registry entry is mutated.
  shape: signal-jsonl
  side_effects: []
  summary: Signal verdict=error, metadata.kind=run_id_sensor_mismatch; exit 1.
id: stop-sensor-run-id-mismatch
journey_id: stop-sensor
name: Reject when explicit run_id belongs to a different sensor
regression_priority: medium
tags:
- error-handling
- framework-stop-sensor
trigger:
  fixture:
    argv:
    - stop-sensor
    - serve-app-blocking/9999-cccc4444
    registry_state:
      entries:
      - run_id: 9999-cccc4444
        sensor_id: postgres-blocking
  shape: cli-argv
  summary: Invoke stop-sensor with sensorA/runID where runID belongs to sensorB.
version: 0.1.0
