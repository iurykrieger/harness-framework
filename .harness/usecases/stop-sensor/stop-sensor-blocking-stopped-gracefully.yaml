behavior:
  business_rules:
  - The manual hold is removed BEFORE the SIGTERM (atomic registry update).
  - graceful_timeout_ms (default 5000) bounds the SIGTERM wait.
  - SIGKILL is only sent if the process is still alive after the timeout.
  - The watcher follows its own SIGTERM-then-SIGKILL sequence with a 1s timeout.
  - signals.log lines are folded into the aggregate via MaxStreamVerdict.
  - The registry entry is removed on success.
  summary: |
    Inside the lock, RemoveHolder strips the manual hold and Save persists
    immediately. After release, syscall.Kill(-pgid, SIGTERM) initiates
    graceful shutdown; if the pgid dies within graceful_timeout_ms, no
    SIGKILL is sent (killed_forcefully=false). The watcher is drained
    similarly. signals.log is parsed; the aggregate is built and emitted
    with metadata.kind=aggregate. The registry entry is removed under a
    fresh lock.
description: |
  Happy path for /stop-sensor on a blocking entry held only by kind=manual.
  Under the registry file lock, the manual hold is removed. After release,
  SIGTERM is sent to the process group; the kill is observed within
  execution.graceful_timeout_ms; the watcher is then drained (SIGTERM →
  short wait → SIGKILL). signals.log is read; the aggregate Signal is
  computed from exit_code_map crossed with stream MaxStreamVerdict. The
  registry entry is removed and the aggregate Signal is emitted.
