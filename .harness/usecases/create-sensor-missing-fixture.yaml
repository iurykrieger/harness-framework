behavior:
  business_rules:
  - Golden cases are part of the sensor's contract; their fixtures must exist before
    the sensor is persisted.
  - Fixture authoring is /create-sensor's responsibility via write-fixture.go.
  summary: Existence check for each golden case's fixture path. Missing file triggers
    an exit-1 with a stderr message naming the path.
description: 'Cross-check variation: when a draft references a fixture path that does
  not exist under <project>/.harness/sensors/fixtures/, write-fixture.go (or the persistence
  cross-check) errors out before the sensor JSON is written. The agent is expected
  to either materialise the fixture or remove the golden case.'
evidence:
- file: skills/create-sensor/scripts/write-fixture.go
  rationale: Fixture-materialisation companion; surfaces missing fixture paths.
expected_outcome:
  fixture:
    exit_code: 1
    stderr_contains: fixtures/missing.json
    target_file_exists: false
  invariants:
  - Exit 1.
  - No file is created.
  shape: Stderr message
  summary: Stderr names the missing fixture path; exit 1; nothing written.
id: create-sensor-missing-fixture
journey_id: create-sensor
name: Reject a draft whose verification.golden_cases[].fixture path is missing
regression_priority: medium
tags:
- validation
- fixture
trigger:
  fixture:
    draft_excerpt:
      verification:
        golden_cases:
        - expected_verdict: pass
          fixture: fixtures/missing.json
  shape: CLI invocation
  summary: Skill invokes write-sensor.go on a draft whose verification.golden_cases
    reference a fixture that has not been written.
version: 1.0.0
