behavior:
  business_rules:
  - Writes are atomic; readers never observe partial content.
  - Permissions are normalized to 0644 on every write.
  summary: os.CreateTemp creates a sibling temp file with the new content; os.Rename
    atomically replaces the target. The chmod step ensures 0644 permissions.
description: 'Idempotency variation: when <out>/.harness/sensors/<id>.json already
  exists, write-sensor overwrites it atomically via temp-file + rename. Subsequent
  reads yield the new content; no torn writes are visible to a concurrent reader.'
evidence:
- file: lib/sensor/persist.go
  rationale: writeCanonical uses os.CreateTemp + Rename to ensure atomicity.
expected_outcome:
  fixture:
    exit_code: 0
    target_file_content_matches: /tmp/draft-v2.json (canonicalised)
  invariants:
  - Target file exists with mode 0644.
  - Temp file does not linger on success.
  shape: Filesystem state
  side_effects:
  - Target file replaced atomically.
  summary: Target file content equals the new draft; mtime is updated; exit code is
    0.
id: detect-sensors-overwrites-existing
journey_id: detect-sensors
name: Re-running write-sensor on the same id overwrites the existing file atomically
