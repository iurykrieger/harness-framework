behavior:
  business_rules:
  - Cursor must satisfy cursor >= 0.
  - Cursor 0 means "read all lines from the start"; positive N means "skip first N".
  - Exit code is 1.
  summary: |
    strconv.Atoi(args[1]) either errors or yields cursor<0. runTail emits
    the tail_invalid_cursor Signal carrying the bad value in the rationale.
    Exit code is 1.
description: |
  The cursor argument must be a non-negative integer (0 = read all, N > 0 =
  skip first N lines). When strconv.Atoi fails or returns a negative value,
  runTail emits a Signal verdict=error, metadata.kind=tail_invalid_cursor
  with rationale naming the offending value, and returns exit 1.
