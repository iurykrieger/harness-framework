behavior:
  business_rules:
  - cursor must be a non-negative integer (strconv.Atoi success + cursor >= 0).
  - Negative integers also fail.
  - Non-numeric strings (e.g. abc) or decimals (e.g. 1.5) also fail.
  - Exit code is 1.
  summary: |
    runTail uses strconv.Atoi on the cursor argument. Any parse error
    or a negative result triggers the tail_invalid_cursor branch.
description: |
  /tail-sensor's second argument MUST parse as a non-negative integer.
  Any other value (negative integer, decimal, non-numeric) emits
  verdict=error, metadata.kind=tail_invalid_cursor, exit code 1.
evidence:
- file: skills/tail-sensor/scripts/tail.go
  line_start: 58
  rationale: strconv.Atoi + non-negative validation; emits tail_invalid_cursor.
expected_outcome:
  fixture:
    exit_code: 1
    stdout_lines:
    - '{"sensor_id":"dev-server","verdict":"error","severity":"high","evidence":[{"rationale":"cursor
      must be a non-negative integer, got \"-1\""}],"cost_actual":{"latency_ms":0},"metadata":{"kind":"tail_invalid_cursor"}}'
  invariants:
  - Exit code is 1.
  - metadata.kind is "tail_invalid_cursor".
  shape: One JSON line on stdout + exit code
  side_effects: []
  summary: One Signal verdict=error, metadata.kind=tail_invalid_cursor, exit code
    1.
id: tail-sensor-invalid-cursor
journey_id: tail-sensor
name: /tail-sensor rejects non-integer or negative cursor
regression_priority: medium
tags:
- error-handling
- validation
trigger:
  fixture:
    argv:
    - tail-sensor
    - dev-server
    - "-1"
  shape: CLI invocation
  summary: /tail-sensor <id> <cursor> where cursor is not a non-negative integer.
version: 0.1.0
