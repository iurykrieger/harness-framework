behavior:
  business_rules:
  - cursor is 1-based — cursor=N skips lines 1..N inclusive.
  - The envelope's next_cursor equals the total line count after this read.
  - Lines are emitted as raw JSON text — they are NOT reparsed by the tail.
  summary: |
    bufio.Scanner increments `current` for each line; the conditional
    `if current <= cursor { continue }` skips the first cursor lines and
    emits the rest. After the loop, the envelope Signal stamps
    next_cursor=current (the total line count, here 5).
description: |
  When cursor=N (positive, <= total line count), runTail walks signals.log
  line by line, ignores the first N lines, then emits each subsequent line
  on stdout. The envelope Signal carries metadata.next_cursor=<new-total>
  so the agent can chain reads. This is the canonical incremental-tail
  pattern used by long-running blocking sensors.
