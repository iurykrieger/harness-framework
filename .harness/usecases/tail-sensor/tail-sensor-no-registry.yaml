behavior:
  business_rules:
  - 'Verdict mapping per CLAUDE.md: /tail-sensor is error when registry is absent.'
  - The rationale references the registry path and remediation hint.
  summary: |
    cli.Bootstrap reports b.Res.Exists=false. runTail emits an
    error/tail_no_registry Signal then returns exit 1.
description: |
  When .harness/runtime/running_sensors.json is absent, no sensor can be
  running and /tail-sensor cannot resolve the entry. runTail emits a Signal
  verdict=error, metadata.kind=tail_no_registry with rationale pointing the
  agent at HARNESS_REGISTRY_ROOT or the original cwd. Exit code 1.
evidence:
- file: skills/tail-sensor/scripts/tail.go
  kind: implementation
  line_end: 83
  line_start: 72
  rationale: tail_no_registry emission path when b.Res.Exists is false.
- file: lib/registry/root.go
  kind: contract
  rationale: registry.Lookup walk-up and HARNESS_REGISTRY_ROOT resolution contract
    that defines b.Res.Exists.
expected_outcome:
  fixture:
    metadata:
      kind: tail_no_registry
    sensor_id: serve-app-blocking
    severity: high
    verdict: error
  invariants:
  - metadata.kind == "tail_no_registry".
  - Exit code is 1.
  - metadata.registry_exists is false (diagnose block).
  shape: signal-jsonl
  side_effects: []
  summary: Signal verdict=error, metadata.kind=tail_no_registry; exit 1.
id: tail-sensor-no-registry
journey_id: tail-sensor
name: Tail with no registry file surfaces an error
regression_priority: high
tags:
- error-handling
- framework-tail-sensor
trigger:
  fixture:
    argv:
    - tail-sensor
    - serve-app-blocking
    - "0"
    registry_state:
      file_exists: false
  shape: cli-argv
  summary: Invoke tail-sensor when the registry file is absent.
version: 0.1.0
