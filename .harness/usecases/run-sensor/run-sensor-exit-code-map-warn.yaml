behavior:
  business_rules:
  - exit_code_map drives the verdict for the exit code observed.
  - Unmapped exit codes default to verdict=error (a sensor execution failure).
  - The runner's exit code reflects whether the sensor ran, not the verdict.
  summary: |
    The runner spawns the subprocess, waits for it to exit, and looks up
    the exit code in exit_code_map to derive the aggregate verdict and
    severity. The runner's own exit code stays 0 because the sensor ran
    successfully and emitted its aggregate.
description: |
  /run-sensor on a sensor whose execution.command exits non-zero, where
  exit_code_map declares that this code is a non-fatal warning. The
  aggregate verdict is warn, exit code 0 (the runner ran successfully).
evidence:
- file: lib/signal/aggregate.go
  rationale: exit_code_map resolution that produces verdict/severity for the aggregate.
- file: skills/run-sensor/scripts/run-computational.go
  line_start: 72
  rationale: Entry point that drives the orchestrator pipeline.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_lines:
    - '{"sensor_id":"go-vet-with-warnings","verdict":"warn","severity":"low","evidence":[],"cost_actual":{"latency_ms":15},"metadata":{"kind":"aggregate","exit_code":2}}'
  invariants:
  - Aggregate verdict equals exit_code_map[2].verdict.
  - Aggregate severity equals exit_code_map[2].severity.
  - Runner exit code is 0 because the sensor ran to completion.
  shape: One JSON line on stdout + exit code
  side_effects: []
  summary: One aggregate Signal verdict=warn severity=low on stdout, exit code 0.
id: run-sensor-exit-code-map-warn
journey_id: run-sensor
name: Sensor exit code maps to verdict=warn via exit_code_map
regression_priority: high
tags:
- happy-path
- exit-code-map
- computational
trigger:
  fixture:
    argv:
    - run-computational
    - go-vet-with-warnings
    sensor:
      execution:
        command: sh -c 'echo warning; exit 2'
        exit_code_map:
        - exit_code: 0
          verdict: pass
        - exit_code: 2
          severity: low
          verdict: warn
      id: go-vet-with-warnings
      output: single
      type: computational
  shape: CLI invocation
  summary: |
    /run-sensor invoked on a sensor whose command exits 2, with
    exit_code_map mapping exit 2 to verdict=warn, severity=low.
version: 0.1.0
