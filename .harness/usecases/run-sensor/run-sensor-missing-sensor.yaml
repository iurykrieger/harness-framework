behavior:
  business_rules:
  - Resolution is performed before any other validation.
  - The exit code is 2 (usage class) because the input was unresolvable.
  summary: |
    sensor.Resolve walks both the bare-id and path-shaped resolution rules; if
    nothing exists it returns a typed error which the runner prints and
    propagates as exit 2.
description: |
  When the agent passes a sensor id (or path) that does not resolve to a
  file under <projectRoot>/.harness/sensors/<id>.yaml, sensor.Resolve returns
  an error. The runner forwards this to stderr ("error: resolve: ...") and
  exits 2 (usage/IO error class) without spawning anything.
evidence:
