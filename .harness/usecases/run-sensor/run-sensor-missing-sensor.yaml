  kind: implementation
  line_end: 95
  line_start: 90
  rationale: sensor.Resolve call site that converts a non-existent id to exit-2 "error
    resolve" output.
- file: lib/sensor/path.go
  kind: implementation
  rationale: Implements bare-id vs path-shaped resolution rules and produces the typed
    error surfaced here.
- file: skills/run-sensor/scripts/run-computational.go
  kind: contract
  line_end: 84
  line_start: 73
  rationale: flag.NewFlagSet definition that declares the CLI argv shape consumed
    by the trigger fixture.
expected_outcome:
  fixture:
    inline:
      exit_code: 2
      stderr_substring: 'error: resolve:'
      stdout: ""
  invariants:
  - Exit code is 2.
  - 'Stderr leads with "error: resolve:".'
  shape: cli-exit
  side_effects: []
  summary: 'Process exits 2 with "error: resolve:" on stderr; nothing on stdout.'
