behavior:
  business_rules:
  - Cancellation must not leak the subprocess (Setsid-ish handling on Unix).
  - Aggregate carries terminated_externally=true; verdict reflects the killed exit
    code mapping.
  summary: signalCancellableContext registers a SIGINT/SIGTERM handler that cancels
    ctx. exec.CommandContext propagates cancellation to the subprocess as SIGKILL.
    When the orchestrator's RunOne sees ctx.Err()!=nil, it sets metadata.terminated_externally=true
    on the aggregate.
description: When a long-running sensor receives SIGINT or SIGTERM, the runner cancels
  the subprocess context (which forwards SIGKILL to the child) and folds metadata.terminated_externally=true
  into the aggregate Signal.
evidence:
- file: skills/run-sensor/scripts/run-computational.go
  line_start: 41
  rationale: signalCancellableContext registers SIGINT/SIGTERM cancellation.
- file: lib/orchestrator/run.go
  rationale: RunOne folds ctx.Err()!=nil into metadata.terminated_externally.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_last_line:
      metadata:
        terminated_externally: true
      sensor_id: long-runner
      verdict: fail
  invariants:
  - metadata.terminated_externally is true.
  - Subprocess group is reaped (no zombie children).
  shape: JSONL on stdout
  summary: Stdout has one aggregate Signal with metadata.terminated_externally=true;
    exit code is 0.
id: run-sensor-sigterm-terminated-externally
journey_id: run-sensor
name: External SIGTERM marks the aggregate as terminated_externally
regression_priority: high
tags:
- error-handling
- signals
- subprocess
trigger:
  fixture:
    argv:
    - long-runner
    external_signal: SIGTERM
    sensor_excerpt:
      execution:
        command: sleep 30
        exit_code_map:
        - exit_code: 143
          severity: high
          verdict: fail
      output: single
      type: computational
  shape: Process signal during CLI invocation
  summary: Agent (or the OS, e.g. on Ctrl-C) sends SIGTERM to a running computational
    runner before the subprocess naturally exits.
version: 1.0.0
