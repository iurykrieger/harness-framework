behavior:
  business_rules:
  - The destination layout is <out>/<journey_id>/<id>.yaml.
  - Both --out and --project-root are required.
  - The output is canonical YAML written atomically.
  summary: |
    run() reads the draft, loads stack.yaml, and delegates to
    usecase.ValidateAndPersist which performs schema validation,
    journey_reference cross-check, and CheckEvidenceFiles before
    writing the file. On success it prints the absolute path to stdout.
description: |
  Happy-path of write-usecase. The draft validates against
  schemas/usecase.yaml, journey_id is found in stack.journeys[], every
  evidence[].file exists on disk under projectRoot, and the YAML is
  written to the per-journey subdirectory.
evidence:
- file: skills/detect-usecases/scripts/write-usecase.go
  line_start: 36
  rationale: run() entry — argument parsing, stack load, usecase.ValidateAndPersist
    delegation, stdout output.
expected_outcome:
  fixture:
    exit_code: 0
    filesystem:
      /repo/.harness/usecases/my-journey/create-foo.yaml: canonical YAML of the validated
        UseCase
    stdout_line: /repo/.harness/usecases/my-journey/create-foo.yaml
  invariants:
  - Exit code is 0.
  - The per-journey subdirectory is created on first write.
  shape: stdout line + exit code + filesystem
  side_effects:
  - Creates or overwrites <out>/<journey_id>/<id>.yaml.
  summary: Absolute output path on stdout, exit code 0.
id: detect-usecases-success
journey_id: detect-usecases
name: write-usecase persists a valid UseCase under <out>/<journey_id>/<id>.yaml
regression_priority: critical
tags:
- happy-path
- persistence
trigger:
  fixture:
    argv:
    - write-usecase
    - --out=/repo/.harness/usecases
    - --project-root=/repo
    - --schemas-dir=/plugin/schemas
    - /tmp/draft-usecase.yaml
    state:
      .harness/stack.yaml: contains journey id=my-journey
  shape: CLI invocation
  summary: write-usecase with a valid draft.
version: 0.1.0
