behavior:
  business_rules:
  - Blocking sensors must be started via /start-sensor; /run-sensor is for sensors
    whose commands terminate on their own.
  summary: After schema validation, the runner inspects execution.blocking and short-circuits
    with verdict=error before any subprocess is spawned.
description: A sensor with execution.blocking=true cannot be invoked via /run-sensor
  — it must be invoked via /start-sensor. The runner detects the flag during validation
  and refuses with an error Signal whose metadata.kind points the agent at /start-sensor.
evidence:
- file: skills/run-sensor/scripts/run-computational.go
  rationale: Pre-spawn check that rejects execution.blocking=true.
expected_outcome:
  fixture:
    exit_code: 1
    stdout_last_line:
      evidence:
      - kind: remediation
        rationale: use /start-sensor for blocking sensors
      sensor_id: dev-server
      verdict: error
  invariants:
  - Subprocess was never spawned.
  - No registry entry written.
  shape: JSONL on stdout
  summary: Stdout has one error Signal whose remediation directs the agent to /start-sensor;
    exit code is 1.
id: run-sensor-blocking-rejected
journey_id: run-sensor
name: Reject blocking sensors with a clear remediation
regression_priority: medium
tags:
- validation
- blocking
trigger:
  fixture:
    argv:
    - dev-server
    sensor_excerpt:
      execution:
        blocking: true
        command: npm run dev
      output: stream
      type: computational
  shape: CLI invocation
  summary: Agent invokes /run-sensor on a sensor declaring execution.blocking=true.
version: 1.0.0
