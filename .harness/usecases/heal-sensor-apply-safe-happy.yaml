behavior:
  business_rules:
  - Only allow-listed actions are permitted.
  - Actions are idempotent (safe to re-run).
  - Secrets-bearing files end up with mode 0600.
  summary: 'For each allow-listed action: pre-check whether the desired post-condition
    already holds; if not, execute; if so, skip. set_env_in_file sets the file mode
    to 0600 after writing.'
description: 'Step 2 of /heal-sensor: apply-safe.go reads a Setup Plan (cp .env.example
  .env, mkdir, touch, set-env-in-file with chmod 600) and executes each action idempotently.
  Re-running the same plan on already-fixed state is a no-op.'
evidence:
- file: skills/heal-sensor/scripts/apply-safe.go
  line_start: 26
  rationale: main() entry of the apply-safe step.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_json:
      applied:
      - .env created
      - DATABASE_URL set
      skipped: []
  invariants:
  - .env file exists with mode 0600.
  - Running apply-safe again with the same plan produces all-skipped output.
  shape: Stdout (JSON)
  side_effects:
  - .env file created.
  - DATABASE_URL line appended/updated.
  - File mode chmod-ed to 0600.
  summary: Stdout has a JSON summary of applied/skipped actions; exit 0.
id: heal-sensor-apply-safe-happy
journey_id: heal-sensor
name: apply-safe runs the allow-listed idempotent fix plan
regression_priority: critical
tags:
- happy-path
- idempotent
- side-effects
trigger:
  fixture:
    argv:
    - --plan=/tmp/setup-plan.json
    - --root=/abs/project
    plan_excerpt:
    - action: cp_if_missing
      dst: .env
      src: .env.example
    - action: set_env_in_file
      file: .env
      key: DATABASE_URL
      value: postgres://localhost/dev
  shape: CLI invocation
  summary: Skill invokes apply-safe.go with the Setup Plan emitted after diagnose.
version: 1.0.0
