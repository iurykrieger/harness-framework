behavior:
  business_rules:
  - The Aggregate envelope is the LAST JSONL line on stdout.
  - One Plan line per proposed sensor in the order planning.Build returns.
  - Planning logic stays in lib/planning — this script is just the wire adapter.
  - Exit code is 0.
  summary: |
    The script reads all of stdin, JSON-unmarshals into the local ledger
    struct, calls planning.Build which returns a []Plan, emits each Plan
    as a JSONL line, then emits planning.MakeAggregate(plans) as the LAST
    line. Exit 0.
description: |
  /create-sensor's plan-sensors is the JSON-on-stdin → JSONL-on-stdout
  adapter for the planner. It reads a ledger (the wire format emitted by
  read-usecases.go), runs planning.Build over the usecases, and emits one
  Plan line per proposed sensor followed by one Aggregate envelope as the
  last line. Exit 0 on success.
