id: create-sensor-success
version: 0.1.0
name: create-sensor write-sensor persists a new sensor and emits sensor_persisted Signal
journey_id: create-sensor
description: |
  Happy-path of /create-sensor's write-sensor. The draft passes schema
  validation, all fixtures exist on disk, and no sensor by that id
  already exists. ValidateAndPersist writes the canonical YAML and the
  script emits a verdict=pass, metadata.kind=sensor_persisted Signal.
trigger:
  shape: CLI invocation
  summary: write-sensor with a valid draft of a brand-new sensor.
  fixture:
    ref: create-sensor/create-sensor-success/trigger.json
behavior:
  summary: |
    run() parses argv, reads the draft, resolves projectRoot via
    registry.Lookup, then calls sensor.ValidateAndPersist with
    RejectIfExists=true + RequireUseCaseFilesOnDisk=true. On success it
    emits the pass Signal plus a trailing line containing the absolute path.
  business_rules:
  - RejectIfExists=true — pre-existing files cause refusal.
  - RequireUseCaseFilesOnDisk=true — every use_cases[] entry must resolve to .harness/usecases/**/<id>.yaml.
  - Stdout carries TWO lines on success — the JSON Signal then the absolute path.
expected_outcome:
  shape: JSONL + path on stdout, exit code, filesystem
  summary: One pass Signal + path on stdout, exit code 0, file written.
  fixture:
    ref: create-sensor/create-sensor-success/outcome.jsonl
  invariants:
  - verdict is "pass".
  - metadata.kind is "sensor_persisted".
  - The destination file exists.
  side_effects:
  - Creates the destination file.
evidence:
- file: skills/create-sensor/scripts/write-sensor.go
  line_start: 105
  rationale: Success branch — emits passSignal and the path line.
- file: schemas/signal.yaml
  kind: contract
  rationale: Defines the Signal envelope emitted on stdout (verdict, severity, evidence, metadata).
regression_priority: critical
tags:
- happy-path
- persistence
