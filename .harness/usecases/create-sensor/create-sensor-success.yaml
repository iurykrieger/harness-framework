behavior:
  business_rules:
  - /create-sensor's write-sensor sets RejectIfExists=true (no silent overwrite).
  - /create-sensor's write-sensor sets RequireUseCaseFilesOnDisk=true (every use_cases[]
    id must resolve to a file).
  - The success Signal carries metadata.{path, id, kind_attr, type_attr}.
  - Exit code is 0.
  summary: |
    The script reads the draft, calls registry.Lookup to resolve
    projectRoot, and invokes sensor.ValidateAndPersist with
    RejectIfExists=true and RequireUseCaseFilesOnDisk=true. On success it
    emits the sensor_persisted Signal and prints the absolute path.
description: |
  Happy path for /create-sensor's persistence script: a fully composed
  sensor draft (assertion kind, sourced from a previously persisted
  usecase) passes schema validation, has no on-disk conflict, and refers
  only to usecases whose files exist. sensor.ValidateAndPersist writes
  the canonical YAML to <projectRoot>/.harness/sensors/<id>.yaml. The
  script emits a verdict=pass / metadata.kind=sensor_persisted Signal and
  prints the absolute path on the next line.
evidence:
- file: skills/create-sensor/scripts/write-sensor.go
  kind: implementation
  line_end: 109
  line_start: 37
  rationale: Entry point that runs registry.Lookup + sensor.ValidateAndPersist with
    the strict options.
- file: lib/sensor/persist.go
  kind: implementation
  rationale: ValidateAndPersist with PersistOpts.RejectIfExists + RequireUseCaseFilesOnDisk
    wiring.
- file: schemas/sensor.yaml
  kind: contract
  rationale: Declares the sensor schema and use_cases[] field consumed by the validator.
expected_outcome:
  fixture:
    ref: create-sensor/create-sensor-success/outcome.json
  invariants:
  - The Signal metadata.kind == "sensor_persisted".
  - Exit code is 0.
  - <projectRoot>/.harness/sensors/<id>.yaml exists after the run.
  shape: signal-jsonl
  side_effects:
  - <projectRoot>/.harness/sensors/<id>.yaml is created (RejectIfExists guarantees
    no overwrite).
  summary: Signal verdict=pass, metadata.kind=sensor_persisted with path metadata;
    absolute path on next line; exit 0.
id: create-sensor-success
journey_id: create-sensor
name: Persist a targeted assertion sensor via write-sensor
regression_priority: critical
