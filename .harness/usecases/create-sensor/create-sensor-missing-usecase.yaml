behavior:
  business_rules:
  - Every assertion's use_cases[] entry must exist as a persisted usecase YAML.
  - The check happens before write — no sensor file is created.
  - Exit code is 2 (usage / pre-check class).
  summary: |
    The PersistOpts.RequireUseCaseFilesOnDisk path indexes
    <projectRoot>/.harness/usecases/ and returns *MissingUseCaseError when
    no file matches. The script's errors.As branch converts the typed
    error into a usecase_not_found Signal.
description: |
  /create-sensor's write-sensor sets PersistOpts.RequireUseCaseFilesOnDisk=
  true. sensor.ValidateAndPersist walks the draft's use_cases[] list and
  verifies each id resolves to <projectRoot>/.harness/usecases/<journey>/
  <id>.yaml. A missing file produces *sensor.MissingUseCaseError which the
  script forwards as a Signal verdict=error, metadata.kind=usecase_not_found
  with exit 2.
evidence:
- file: skills/create-sensor/scripts/write-sensor.go
  kind: implementation
  line_end: 96
  line_start: 91
  rationale: errors.As branch catching *MissingUseCaseError and emitting usecase_not_found.
- file: lib/sensor/persist.go
  kind: implementation
  rationale: ValidateAndPersist's RequireUseCaseFilesOnDisk implementation that produces
    the typed error.
- file: schemas/sensor.yaml
  kind: contract
  rationale: Declares the use_cases[] field on assertion sensors that this check enforces.
expected_outcome:
  fixture:
    last_jsonl_signal:
      metadata:
        kind: usecase_not_found
      sensor_id: write-sensor
      severity: high
      verdict: error
  invariants:
  - metadata.kind == "usecase_not_found".
  - Exit code is 2.
  - No sensor file is created.
  shape: signal-jsonl
  side_effects: []
  summary: Signal verdict=error, metadata.kind=usecase_not_found; exit 2; no file
    written.
id: create-sensor-missing-usecase
journey_id: create-sensor
name: write-sensor rejects an assertion whose use_cases[] file is absent
regression_priority: high
tags:
- error-handling
- validation
- framework-create-sensor
trigger:
  fixture:
    argv:
    - write-sensor
    - --out=/tmp/projectG/.harness/sensors
    - /tmp/draft.yaml
    draft_payload:
      id: assert-charge-201
      kind: assertion
      use_cases:
      - never-persisted-usecase
      version: 0.1.0
    project_state:
      usecases_dir_empty: true
  shape: cli-argv
  summary: Run create-sensor's write-sensor with use_cases referencing a usecase id
    that has not been persisted.
version: 0.1.0
