behavior:
  business_rules:
  - The target path must stay inside <projectRoot>/.harness/sensors/fixtures.
  - No write occurs on escape.
  - Exit code is 2.
  summary: |
    runWithStdin sanitizes the --path argument by joining it with the
    fixtures base and then asserting the joined path is still inside.
    Escapes via .. or absolute paths trip the FixturePathEscapeError.
description: |
  write-fixture computes the target as filepath.Join(<fixturesBase>,
  relPath) and verifies the result stays under fixturesBase. Any
  ".." escape produces FixturePathEscapeError; the script emits
  verdict=error, metadata.kind=fixture_path_escape, exit code 2.
evidence:
- file: skills/create-sensor/scripts/write-fixture.go
  line_start: 68
  rationale: FixturePathEscapeError handling branch.
expected_outcome:
  fixture:
    exit_code: 2
    stdout_lines:
    - '{"sensor_id":"write-fixture","verdict":"error","severity":"high","evidence":[{"rationale":"path
      escapes fixtures base"}],"cost_actual":{"latency_ms":1},"metadata":{"kind":"fixture_path_escape"}}'
  invariants:
  - metadata.kind is "fixture_path_escape".
  - No file is written.
  shape: One JSON line on stdout + exit code
  side_effects: []
  summary: One error Signal verdict=error, kind=fixture_path_escape, exit code 2.
id: create-sensor-fixture-path-escape
journey_id: create-sensor
name: create-sensor write-fixture refuses paths that escape the fixtures base
regression_priority: high
tags:
- security
- error-handling
trigger:
  fixture:
    argv:
    - write-fixture
    - --path=../../etc/passwd
    stdin: PWNED
  shape: CLI invocation
  summary: write-fixture --path ../../etc/passwd (or any path that escapes the fixtures
    base).
version: 0.1.0
