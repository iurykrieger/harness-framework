behavior:
  business_rules:
  - Exit code 1 is reserved for schema validation failures.
  - The Signal's rationale contains the validation error text.
  - No sensor file is written.
  summary: |
    schema.Validate fires on the missing calibration block (required by the
    allOf branch for type=inferential). The script catches the typed error
    and emits the schema_invalid Signal.
description: |
  When the draft violates schemas/sensor.yaml (e.g. an inferential sensor
  missing the calibration block, a stream sensor missing
  execution.output_parsing.patterns), sensor.ValidateAndPersist returns a
  jsonschema.ValidationError. The errors.As branch in write-sensor
  surfaces it as Signal verdict=error, metadata.kind=schema_invalid and
  exits 1.
