behavior:
  business_rules:
  - Schema-invalid sensors are skipped (not fatal).
  - The digest path uses forward slashes regardless of platform.
  - Order is the order returned by lib/sensor.Catalog (deterministic, by id).
  - Exit code is 0 on normal completion.
  summary: |
    cli.Bootstrap resolves the project root. lib/sensor.Catalog returns
    valid sensors + a CatalogWarn slice for skipped files. The script
    emits warn Signals for the skipped entries first, then one digest
    line per valid sensor.
description: |
  /create-sensor's catalog-sensors enumerates every sensor JSON/YAML under
  <projectRoot>/.harness/sensors/ via lib/sensor.Catalog and emits one
  JSONL digest line per sensor (id, kind, type, output, blocking,
  description, path). Schema-invalid or malformed sensor files are
  skipped with a Signal verdict=warn, metadata.kind=catalog_entry_skipped
  carrying the reason in evidence[]. The script supports the dependency-
  selection dialogue in the /create-sensor SKILL.
