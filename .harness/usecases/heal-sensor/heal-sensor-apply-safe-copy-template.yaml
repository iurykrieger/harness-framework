behavior:
  business_rules:
  - 'Idempotent: re-running the action when .env is already up-to-date is a no-op.'
  - 'Atomic: partial files are never visible at the destination.'
  - The result list is emitted as a JSON document on stdout with per-action results.
  - Exit code is 0.
  summary: |
    heal.Apply matches the action against the allowlist, runs the copy
    via tmp+rename atomic write, and returns ApplyResult{applied: true}
    for the action.
description: |
  Step 2 of /heal-sensor. apply-safe iterates Plan.AutoApply actions and
  invokes lib/heal.Apply. The "copy_template" action (e.g. cp .env.example
  .env) is allowlisted as idempotent: if the destination already exists
  with the same bytes, the action is a no-op; otherwise the template
  bytes are written atomically (tmp + rename), preserving mode 0o600 if
  the file contains secrets.
evidence:
- file: skills/heal-sensor/scripts/apply-safe.go
  kind: implementation
  line_end: 71
  line_start: 29
  rationale: Entry point that drives heal.Apply over Plan.AutoApply.
- file: lib/heal/apply.go
  kind: implementation
  rationale: Apply implementation that runs copy_template through the allowlist.
- file: schemas/sensor.yaml
  kind: contract
  rationale: Declares the requires[].kind=env shape that the copy_template action
    satisfies.
expected_outcome:
  fixture:
    stdout_object:
      results:
      - action:
          action: copy_template
          dst: .env
          src: .env.example
        applied: true
        needs_input: false
  invariants:
  - results[0].applied is true.
  - <root>/.env exists after the run.
  - Exit code is 0.
  shape: stdout-json
  side_effects:
  - <root>/.env is created or overwritten atomically with the .env.example bytes.
  summary: results[0].applied=true, results[0].action.action="copy_template"; .env
    exists; exit 0.
