trigger:
  fixture:
    argv:
    - retry-original
    - --sensor=/tmp/projectH/.harness/sensors/lint-go-vet-computational.yaml
    env:
      CLAUDE_PLUGIN_ROOT: ""
  shape: cli-argv
  summary: Run retry-original with CLAUDE_PLUGIN_ROOT unset in the environment.
