          version: 0.1.0
      sensor_patches:
      - id: integration-test
        patch:
          requires:
          - kind: env
            name: DATABASE_URL
          version: 0.1.1
  shape: CLI invocation
  summary: apply-sensors --plan=…/plan.json --out=…/.harness/sensors with a plan that
    contains both patches and new sensors.
