behavior:
  business_rules:
  - 'Cursor is monotonic: never decreases between calls.'
  - Caller must thread next_cursor back as the cursor on the next call.
  summary: Skip the first 2 lines, emit line 3 as an individual Signal, then emit
    envelope with next_cursor=3.
description: 'Incremental read variation: with a cursor N>0, /tail-sensor returns
  only lines whose 1-based index is greater than N, then the envelope Signal whose
  next_cursor reflects the new total line count.'
evidence:
- file: skills/tail-sensor/scripts/tail.go
  rationale: Cursor-driven line skip; envelope emission.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_jsonl:
    - sensor_id: dev-server
      verdict: fail
    - metadata:
        kind: envelope
        next_cursor: 3
      verdict: pass
  invariants:
  - Number of individual Signals == (lineCount - cursor).
  - Envelope next_cursor == lineCount.
  shape: JSONL on stdout
  summary: Stdout has the fail line followed by envelope with next_cursor=3.
id: tail-sensor-cursor-mid-returns-suffix
journey_id: tail-sensor
name: Cursor=N returns only lines N+1..end
regression_priority: critical
tags:
- happy-path
- cursor
- incremental
trigger:
  fixture:
    argv:
    - dev-server
    - "2"
    signals_log_lines:
    - '{"sensor_id":"dev-server","verdict":"pass"}'
    - '{"sensor_id":"dev-server","verdict":"warn"}'
    - '{"sensor_id":"dev-server","verdict":"fail","metadata":{"line":"error connecting
      to db"}}'
  shape: CLI invocation
  summary: Agent invokes /tail-sensor dev-server 2 after a previous tail returned
    next_cursor=2.
version: 1.0.0
