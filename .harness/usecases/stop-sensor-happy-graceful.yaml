behavior:
  business_rules:
  - Stop-sensor is idempotent (no-op + warn when not running).
  - Holders block teardown — only the LAST holder triggers the kill sequence.
  - Graceful path skips SIGKILL when the subprocess exits in time.
  summary: 'Under the registry lock: (1) remove the caller''s manual hold, (2) if
    no other holders remain, kill the subprocess group with SIGTERM, (3) wait up to
    execution.graceful_timeout_ms, (4) since the subprocess exits, skip SIGKILL, (5)
    signal the watcher to drain raw.log fully, (6) read signals.log, (7) build the
    aggregate Signal, (8) remove the registry entry.'
description: 'Happy path: invoke /stop-sensor on a running blocking sensor that has
  only kind=manual holders. The script removes the manual hold, sends SIGTERM to the
  subprocess group, the subprocess exits before execution.graceful_timeout_ms elapses,
  the watcher drains, the aggregate Signal is built from signals.log, and the registry
  entry is removed.'
evidence:
- file: skills/stop-sensor/scripts/stop.go
  line_start: 46
  rationale: runStop covers hold removal, kill sequence, watcher drain, aggregate
    emission, entry removal.
expected_outcome:
  fixture:
    exit_code: 0
    registry_after: {}
    stdout_last_line:
      metadata:
        killed_forcefully: false
        kind: stopped
        lifecycle:
          teardown: []
      sensor_id: dev-server
      verdict: pass
  invariants:
  - killed_forcefully=false when the subprocess exits within graceful_timeout_ms.
  - Registry entry is removed atomically.
  - Aggregate is built from signals.log including the final drain.
  shape: JSONL on stdout + filesystem state
  side_effects:
  - SIGTERM sent to the subprocess group.
  - Watcher subprocess receives drain signal.
  - .harness/runtime/running_sensors.json entry removed.
  summary: Stdout has one aggregate Signal; the registry entry is gone; subprocess
    and watcher pids are dead.
id: stop-sensor-happy-graceful
journey_id: stop-sensor
name: Stop a running sensor whose subprocess exits cleanly after SIGTERM
regression_priority: critical
tags:
- happy-path
- blocking
- side-effects
trigger:
  fixture:
    argv:
    - dev-server
    registry_state:
      dev-server:
        held_by:
        - attached_at: '*'
          kind: manual
        pid: 12345
        pid_alive: true
        signals_log_path: .harness/runtime/dev-server/signals.log
        watcher_pid: 12346
  shape: CLI invocation
  summary: Agent invokes /stop-sensor on a running blocking sensor with no other holders.
version: 1.0.0
