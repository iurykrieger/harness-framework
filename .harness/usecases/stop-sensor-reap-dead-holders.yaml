behavior:
  business_rules:
  - Dead holders never block teardown when the flag is set.
  - Without the flag, dead holders still block (conservative default).
  summary: 'Under the registry lock: (1) drop holders whose pid_alive=false; (2) remove
    the manual hold; (3) if no live holders remain, proceed with the normal stop sequence.
    metadata.reaped_holders carries the list of dropped entries in the aggregate.'
description: 'Recovery variation: when /list-sensors shows the sensor with kind=sensor
  holders whose pid is dead (typically a crashed orchestrator or a SIGKILL''d /start-sensor),
  passing --reap-dead-holders to /stop-sensor drops those entries before deciding
  whether the sensor is still held, then proceeds with the normal teardown if no live
  holders remain.'
evidence:
- file: skills/stop-sensor/scripts/stop.go
  rationale: Reap-dead-holders branch in runStop; folds reaped entries into the aggregate
    metadata.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_last_line:
      metadata:
        kind: stopped
        reaped_holders:
        - id: crashed-orchestrator
          kind: sensor
          pid: 999
      sensor_id: postgres
      verdict: pass
  invariants:
  - reaped_holders is non-empty iff the flag was set and dead holders were present.
  - Without the flag, the sensor would have been held instead of stopped.
  shape: JSONL on stdout
  summary: Stdout has the normal stopped aggregate plus metadata.reaped_holders listing
    what was removed.
id: stop-sensor-reap-dead-holders
journey_id: stop-sensor
name: --reap-dead-holders flag drops dead holders before evaluating held
regression_priority: medium
tags:
- recovery
- holders
- flag-driven
trigger:
  fixture:
    argv:
    - postgres
    - --reap-dead-holders
    registry_state:
      postgres:
        held_by:
        - kind: manual
        - id: crashed-orchestrator
          kind: sensor
          pid: 999
          pid_alive: false
        pid: 100
        pid_alive: true
  shape: CLI invocation
  summary: Agent invokes /stop-sensor --reap-dead-holders on a sensor whose holders
    include kind=sensor entries with dead pids.
version: 1.0.0
