behavior:
  business_rules:
  - Evidence must point at the implementation, not the test or the spec.
  - Missing evidence is an authoring error, not an I/O error → exit 1.
  summary: After schema + journey cross-check, the evidence loop stats each file under
    project root. First missing path triggers an error return.
description: 'Cross-check variation: every evidence[].file must resolve to a real
  path under the project root. If any path is missing, ValidateAndPersist returns
  an error before writing; the script exits 1 with a clear stderr message naming the
  missing file.'
evidence:
- file: lib/usecase/evidence.go
  rationale: Evidence existence check called by ValidateAndPersist.
expected_outcome:
  fixture:
    exit_code: 1
    stderr_contains: src/nope.go
    target_file_exists: false
  invariants:
  - Exit 1 (not 2).
  - Output dir unchanged.
  shape: Stderr message
  summary: Stderr names the missing file; exit 1; nothing written.
id: detect-usecases-evidence-missing
journey_id: detect-usecases
name: Reject a UseCase whose evidence file does not exist in the project tree
regression_priority: high
tags:
- validation
- cross-check
- evidence
trigger:
  fixture:
    draft_excerpt:
      evidence:
      - file: src/nope.go
        rationale: doesnt exist
  shape: CLI invocation
  summary: Skill invokes write-usecase.go with a draft whose evidence[].file points
    at a nonexistent path.
version: 1.0.0
