behavior:
  business_rules:
  - Live sensor holders block stop.
  - Dead sensor holders are not handled here — see /stop-sensor --reap-dead-holders.
  summary: 'Under the registry lock: remove the caller''s manual hold, evaluate remaining
    holders. If any holder is a live sensor, abort the kill, persist the registry
    without the manual entry, and emit a held Signal with metadata.kind=held metadata.held_by=[remaining
    holders].'
description: 'Holder invariant: when the caller''s kind=manual hold is removed but
  a kind=sensor holder remains, the script refuses to kill the subprocess and emits
  a held Signal listing the remaining holders. The subprocess keeps running.'
evidence:
- file: skills/stop-sensor/scripts/stop.go
  rationale: Holder evaluation after manual hold removal; refuses kill when live sensor
    holders remain.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_last_line:
      metadata:
        held_by:
        - id: api-tests
          kind: sensor
        kind: held
      sensor_id: postgres
      verdict: warn
  invariants:
  - Subprocess pid is still alive after the call.
  - Manual hold was removed; sensor hold remains.
  shape: JSONL on stdout
  summary: Stdout has one held Signal; subprocess is still alive; registry entry persists
    without the manual hold.
id: stop-sensor-held-by-dependent
journey_id: stop-sensor
name: Refuse stop when another sensor still holds the run
regression_priority: high
tags:
- error-handling
- holders
- concurrency
trigger:
  fixture:
    argv:
    - postgres
    registry_state:
      postgres:
        held_by:
        - attached_at: '*'
          kind: manual
        - id: api-tests
          kind: sensor
          pid: 200
          pid_alive: true
        pid: 100
        pid_alive: true
  shape: CLI invocation
  summary: Agent invokes /stop-sensor on a sensor whose held_by includes a live dependent
    sensor.
version: 1.0.0
