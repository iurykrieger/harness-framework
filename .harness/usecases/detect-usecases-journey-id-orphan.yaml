behavior:
  business_rules:
  - An empty Stack.Journeys + any non-empty journey_id is an orphan.
  - Exit 1 (validation failure), not 2 (I/O).
  summary: After schema validation passes, the cross-check iterates stack.Journeys
    looking for a match. None found → return CrossCheckError. Script prints the error
    to stderr and exits 1.
description: 'Cross-check variation: when a draft''s journey_id is not present in
  stack.journeys[].id, lib/usecase.CheckJourneyReference returns a stack.CrossCheckError
  of kind journey_reference_orphan. write-usecase prints the error and exits 1.'
evidence:
- file: lib/usecase/cross_check.go
  line_start: 13
  rationale: CheckJourneyReference returns stack.CrossCheckError when no journey matches.
expected_outcome:
  fixture:
    exit_code: 1
    stderr_contains: journey_reference_orphan
    target_file_exists: false
  invariants:
  - Exit 1.
  - Output dir unchanged.
  shape: Stderr message
  summary: Stderr names the orphan id; exit 1; nothing written.
id: detect-usecases-journey-id-orphan
journey_id: detect-usecases
name: Reject a UseCase whose journey_id does not match any stack journey
regression_priority: high
tags:
- validation
- cross-check
trigger:
  fixture:
    draft_excerpt:
      id: orphan-uc
      journey_id: nope-not-here
    stack_journeys_ids:
    - run-sensor
    - start-sensor
  shape: CLI invocation
  summary: Skill invokes write-usecase.go with a draft referring to a nonexistent
    journey.
version: 1.0.0
