behavior:
  business_rules:
  - Order of entries in metadata.entries is unspecified but stable within one process.
  - Each entry includes all fields documented in SKILL.md.
  summary: Iterate over the registry map, run liveness checks on each entry's subprocess
    and watcher pids, recursively annotate kind=sensor holders, fold all into a single
    list Signal.
description: 'Steady-state happy path: /list-sensors with two or more running sensors
  emits one Signal whose metadata.entries lists each sensor with sensor_id, pid (pid_alive=true),
  watcher_pid (watcher_alive=true), started_at, command, held_by (each kind=sensor
  holder annotated with its own pid_alive), signals_log_path, and state=running.'
evidence:
- file: skills/list-sensors/scripts/list.go
  rationale: Aggregation over multiple registry entries.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_last_line:
      metadata:
        entries:
        - sensor_id: dev-server
          state: running
        - held_by:
          - id: api-tests
            kind: sensor
            pid: 300
            pid_alive: true
          sensor_id: postgres
          state: running
        kind: list
      verdict: pass
  invariants:
  - entries length == registry map size.
  - Live kind=sensor holders carry pid_alive=true.
  shape: JSONL on stdout
  summary: Stdout has one Signal whose metadata.entries has two objects, both with
    state=running.
id: list-sensors-multiple-entries
journey_id: list-sensors
name: List multiple live sensors with their holders annotated
regression_priority: high
tags:
- happy-path
- multi-entry
trigger:
  fixture:
    argv: []
    registry_state:
      dev-server:
        held_by:
        - kind: manual
        pid: 100
        pid_alive: true
      postgres:
        held_by:
        - id: api-tests
          kind: sensor
          pid: 300
          pid_alive: true
        pid: 200
        pid_alive: true
  shape: CLI invocation
  summary: Agent invokes /list-sensors when multiple blocking sensors are active.
version: 1.0.0
