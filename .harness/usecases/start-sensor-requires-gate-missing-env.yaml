behavior:
  business_rules:
  - PreflightGate evaluates before any spawn (prepare, command, watcher).
  - Gate-failure signal cause is always preflight_failed.
  summary: Before any spawn, orchestrator.PreflightGate evaluates requires[kind∈{tool,context,env}].
    The missing env produces a failed Signal whose cause=preflight_failed. /start-sensor
    returns the signal and does not detach.
description: Sensor declares requires[kind=env,name=DATABASE_URL]; the env var is
  unset. orchestrator.PreflightGate fails before the spawn and emits the canonical
  signal metadata.kind=failed cause=preflight_failed. /start-sensor surfaces this
  Signal and aborts.
evidence:
- file: lib/orchestrator/gate.go
  rationale: PreflightGate evaluates requires[kind∈{tool,context,env}] and returns
    the canonical failure Signal.
- file: skills/start-sensor/scripts/start.go
  rationale: Calls PreflightGate before the detach.
expected_outcome:
  fixture:
    exit_code: 1
    stdout_last_line:
      metadata:
        cause: preflight_failed
        kind: failed
        missing:
        - kind: env
          name: DATABASE_URL
      sensor_id: api
      verdict: fail
  invariants:
  - Subprocess was never spawned.
  - Watcher was never spawned.
  - Registry is unchanged.
  shape: JSONL on stdout
  summary: Stdout has one failed Signal with metadata.cause=preflight_failed naming
    the missing requirement.
id: start-sensor-requires-gate-missing-env
journey_id: start-sensor
name: Pre-flight gate fails when a required env var is missing
regression_priority: high
tags:
- validation
- requires-gate
- env
trigger:
  fixture:
    argv:
    - api
    env:
      CLAUDE_PLUGIN_ROOT: /abs/plugin
      HARNESS_REGISTRY_ROOT: /abs/project
    sensor_excerpt:
      execution:
        blocking: true
        command: ./api
      requires:
      - kind: env
        name: DATABASE_URL
  preconditions:
  - DATABASE_URL is not set in the process environment.
  shape: CLI invocation
  summary: Agent invokes /start-sensor on a sensor with a requires[kind=env] entry
    whose env var is not set.
version: 1.0.0
