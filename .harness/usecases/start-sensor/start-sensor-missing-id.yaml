behavior:
  business_rules:
  - The sensor id is the first and only required positional argument.
  - The missing-id Signal carries sensor_id="unknown".
  - Exit code is 2 (usage class).
  summary: |
    After cli.Bootstrap succeeds, runStart inspects args; len(args) < 1
    yields a failed Signal with cause=bootstrap_failed and exit code 2.
description: |
  When the user invokes /start-sensor with no positional argument, runStart
  returns exit code 2 and emits a Signal verdict=error, metadata.kind=failed
  with cause=bootstrap_failed and rationale naming the missing argument.
  Nothing is spawned, nothing is written to the registry.
