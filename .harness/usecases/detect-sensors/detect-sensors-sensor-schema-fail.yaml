behavior:
  business_rules:
  - Exit code 1 is reserved for schema validation failures.
  - The validation tree is rendered in full on stderr.
  - No sensor file is written when validation fails.
  summary: |
    schema.Validate returns a ValidationError naming the missing
    execution.exit_code_map. write-sensor passes the error to
    schema.PrintValidationOrPlain (printing the validation tree on stderr)
    and returns exit 1.
description: |
  When a sensor draft violates schemas/sensor.yaml (e.g. computational
  sensor missing execution.exit_code_map, or stream sensor missing
  execution.output_parsing.patterns), sensor.ValidateAndPersist returns a
  jsonschema.ValidationError. write-sensor catches it via errors.As, prints
  the validation tree on stderr, and returns exit 1. No file is written.
evidence:
- file: skills/detect-sensors/scripts/write-sensor.go
  kind: implementation
  line_end: 71
  line_start: 62
  rationale: errors.As branch that converts a jsonschema.ValidationError to exit 1.
- file: schemas/sensor.yaml
  kind: contract
  rationale: Declares the sensor schema (allOf discriminators) whose violation produces
    the rejection.
expected_outcome:
  fixture:
    exit_code: 1
    file_written: false
    stderr_substring: INVALID
  invariants:
  - Exit code is 1.
  - No file is created in <out>/.
  - stderr contains validation diagnostics.
  shape: cli-exit
  side_effects: []
  summary: stderr contains the validation tree; exit 1; no sensor file written.
id: detect-sensors-sensor-schema-fail
journey_id: detect-sensors
name: write-sensor rejects a draft that fails schema validation
regression_priority: high
tags:
- error-handling
- validation
- framework-detect-sensors
trigger:
  fixture:
    argv:
    - write-sensor
    - --out=/tmp/projectE/.harness/sensors
    - /tmp/bad-draft.yaml
    draft_payload:
      cost:
        compute: low
        latency:
          timeout_ms: 5000
      execution:
        command: false
      id: bad-sensor
      kind: observation
      output: single
      type: computational
      version: 0.1.0
  shape: cli-argv
  summary: Run write-sensor against a draft that omits the required execution.exit_code_map
    for a computational sensor.
version: 0.1.0
