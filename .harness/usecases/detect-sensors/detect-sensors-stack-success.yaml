behavior:
  business_rules:
  - The draft is converted to canonical YAML (via sigs.k8s.io/yaml) on write.
  - The canonical path is <out>/.harness/stack.yaml.
  - Comments in the draft are NOT preserved (yaml round-trip strips them).
  - Exit code is 0.
  summary: |
    write-stack reads the draft, calls stack.ValidateAndPersist (schema +
    cross-checks), which writes canonical YAML to .harness/stack.yaml.
    The absolute path is printed on stdout; exit code is 0.
description: |
  Phase A of /detect-sensors writes a draft stack payload (JSON/YAML) to
  <project>/.harness/stack.yaml. write-stack delegates validation +
  cross-checks (CheckProducedBy, CheckJourneyArchetypes) to
  stack.ValidateAndPersist; on success it prints the absolute path and
  returns exit 0.
