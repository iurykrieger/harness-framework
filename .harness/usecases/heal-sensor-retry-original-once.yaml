behavior:
  business_rules:
  - Exactly one retry per /heal-sensor invocation.
  - Sensor type discriminates the runner choice.
  - The retry uses the canonical plugin-root invocation contract.
  summary: Read the sensor JSON, pick the runner based on sensor.type (computational
    → run-computational, inferential → run-inferential), shell out to that runner
    under the canonical invocation contract (HARNESS_REGISTRY_ROOT, GOWORK=off, -C
    CLAUDE_PLUGIN_ROOT), and forward its exit code and stdout.
description: 'Step 4 of /heal-sensor: retry-original.go re-invokes the original failing
  sensor once via the appropriate runner (computational or inferential) and emits
  its aggregate Signal. If the sensor passes, the heal cycle is complete; if it fails
  again, the agent does NOT loop — the next attempt requires a fresh /heal-sensor
  invocation by the user.'
evidence:
- file: skills/heal-sensor/scripts/retry-original.go
  line_start: 26
  rationale: main() entry of the retry-original step.
expected_outcome:
  fixture:
    exit_code: 0
    stdout_last_line:
      sensor_id: api-tests
      verdict: pass
  invariants:
  - Exactly one retry runs.
  - If sensor.type=computational, run-computational is invoked; if inferential, run-inferential.
  shape: JSONL on stdout (forwarded from the runner)
  summary: Stdout is the retry sensor's full JSONL output; exit code is the runner's
    exit code.
id: heal-sensor-retry-original-once
journey_id: heal-sensor
name: retry-original re-invokes the failing sensor exactly once
regression_priority: high
tags:
- happy-path
- retry
trigger:
  fixture:
    argv:
    - --sensor=/abs/project/.harness/sensors/api-tests.json
  shape: CLI invocation
  summary: Skill invokes retry-original.go after apply-safe + apply-sensors have run
    successfully.
version: 1.0.0
