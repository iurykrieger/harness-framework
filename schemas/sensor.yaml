$defs:
  AssertStep:
    description: Pure verdict gate; consumes prior step outputs via expect.value.
      Rule 10 (cross-field validation) forbids declaring `with:` on an assert step.
    not:
      required:
      - with
    properties:
      expect:
        $ref: '#/$defs/Matcher'
      type:
        const: assert
    required:
    - expect
    type: object
  ExitCodeMapEntry:
    additionalProperties: false
    properties:
      exit_code:
        oneOf:
        - minimum: 0
          type: integer
        - const: '*'
          type: string
      severity:
        $ref: signal.yaml#/$defs/Severity
      verdict:
        $ref: signal.yaml#/$defs/Verdict
    required:
    - exit_code
    - verdict
    - severity
    type: object
  HttpExpect:
    description: Assertion shape for HTTP responses. body accepts either one matcher
      (single-shot) or an array of matchers (AND-combined).
    properties:
      body:
        oneOf:
        - $ref: '#/$defs/Matcher'
        - items:
            $ref: '#/$defs/Matcher'
          type: array
      headers:
        additionalProperties:
          $ref: '#/$defs/Matcher'
        type: object
      status:
        $ref: '#/$defs/Matcher'
    type: object
  HttpStep:
    description: Issue one HTTP request and (optionally) assert on the response.
      Body source is exactly one of fixture / template / inline; timeout is a
      duration string (e.g. "30s").
    properties:
      body_from:
        oneOf:
        - properties:
            fixture:
              type: string
          required:
          - fixture
        - properties:
            template:
              type: string
          required:
          - template
        - properties:
            inline: {}
          required:
          - inline
      expect:
        $ref: '#/$defs/HttpExpect'
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        type: string
      outputs:
        $ref: '#/$defs/StepOutputs'
      timeout:
        pattern: ^[0-9]+(ms|s|m)$
        type: string
      type:
        const: http
      url:
        minLength: 1
        type: string
    required:
    - method
    - url
    type: object
  Matcher:
    additionalProperties: false
    description: Generic value matcher; accessor under jsonpath extracts before
      comparing. Modifiers are independent (equals, matches, gte, lte, type,
      min_length, max_length, contains, value).
    properties:
      contains:
        type: string
      equals: {}
      gte:
        type: number
      jsonpath:
        type: string
      lte:
        type: number
      matches:
        type: string
      max_length:
        minimum: 0
        type: integer
      min_length:
        minimum: 0
        type: integer
      type:
        enum:
        - string
        - number
        - boolean
        - array
        - object
        - 'null'
        type: string
      value: {}
    type: object
  Pattern:
    additionalProperties: false
    description: Single match rule for line-by-line output parsing. Identical
      shape to execution.output_parsing.patterns[] items; factored out so step
      `parse:` blocks reuse it.
    properties:
      captures:
        additionalProperties: false
        description: Map a Signal.evidence field to a 1-based capture-group index
          in regex.
        properties:
          excerpt:
            minimum: 1
            type: integer
          file:
            minimum: 1
            type: integer
          line_end:
            minimum: 1
            type: integer
          line_start:
            minimum: 1
            type: integer
          rationale:
            minimum: 1
            type: integer
        type: object
      regex:
        description: Go regexp (RE2).
        type: string
      severity:
        $ref: signal.yaml#/$defs/Severity
      verdict:
        $ref: signal.yaml#/$defs/Verdict
    required:
    - regex
    - verdict
    - severity
    type: object
  SensorStep:
    description: Inline sub-run of another sensor. ref points at a sensor id;
      outputs_passthrough re-emits the child's signals into this sensor's
      stream when true.
    properties:
      outputs:
        $ref: '#/$defs/StepOutputs'
      outputs_passthrough:
        type: boolean
      ref:
        pattern: ^[a-z][a-z0-9-]*$
        type: string
      type:
        const: sensor
    required:
    - ref
    type: object
  ShellStep:
    description: Run a shell command. exit_code_map keys are stringified exit
      codes (e.g. "0", "1", "*"). parse declares optional line-by-line output
      parsing for stream output.
    properties:
      exit_code_map:
        additionalProperties:
          $ref: signal.yaml#/$defs/Verdict
        type: object
      outputs:
        $ref: '#/$defs/StepOutputs'
      parse:
        properties:
          patterns:
            items:
              $ref: '#/$defs/Pattern'
            minItems: 1
            type: array
        required:
        - patterns
        type: object
      run:
        minLength: 1
        type: string
      type:
        const: shell
    required:
    - run
    type: object
  Step:
    description: One entry in execution.steps[]. Discriminated by `type` into
      one of shell, http, assert, sensor.
    oneOf:
    - $ref: '#/$defs/ShellStep'
    - $ref: '#/$defs/HttpStep'
    - $ref: '#/$defs/AssertStep'
    - $ref: '#/$defs/SensorStep'
    properties:
      id:
        pattern: ^[a-z][a-z0-9-]*$
        type: string
      type:
        enum:
        - shell
        - http
        - assert
        - sensor
      with:
        $ref: '#/$defs/StepInputs'
    required:
    - id
    - type
    type: object
  StepInputs:
    additionalProperties:
      oneOf:
      - type: string
      - type: number
      - type: boolean
      - properties:
          fixture:
            type: string
        required:
        - fixture
        type: object
    type: object
  StepOutputs:
    additionalProperties:
      oneOf:
      - required:
        - regex
      - required:
        - jsonpath
      - required:
        - trim
      - allOf:
        - not:
            required:
            - regex
        - not:
            required:
            - jsonpath
        - not:
            required:
            - trim
      properties:
        from:
          minLength: 1
          type: string
        jsonpath:
          type: string
        regex:
          type: string
        trim:
          type: boolean
      required:
      - from
      type: object
    type: object
  LifecycleStep:
    additionalProperties: false
    properties:
      command:
        description: Shell invocation (sh -c). MUST be idempotent.
        type: string
      exit_code_map:
        description: Override only when tooling uses non-standard codes (e.g. 2 =
          'already exists', treat as pass). When omitted, runner applies the default
          [{0:pass/info},{*:fail/high}].
        items:
          $ref: '#/$defs/ExitCodeMapEntry'
        minItems: 1
        type: array
      timeout_ms:
        description: Hard cap; falls back to cost.latency.timeout_ms when omitted.
        minimum: 1
        type: integer
    required:
    - command
    type: object
  RequireContext:
    additionalProperties: false
    properties:
      kind:
        const: context
      path:
        type: string
    required:
    - kind
    - path
    type: object
  RequireEnv:
    additionalProperties: false
    properties:
      description:
        type: string
      kind:
        const: env
      name:
        pattern: ^[A-Z_][A-Z0-9_]*$
        type: string
      optional:
        default: false
        type: boolean
    required:
    - kind
    - name
    type: object
  RequirePermission:
    additionalProperties: false
    properties:
      kind:
        const: permission
      scope:
        type: string
    required:
    - kind
    - scope
    type: object
  RequireSensor:
    additionalProperties: false
    properties:
      id:
        pattern: ^[a-z][a-z0-9-]*$
        type: string
      kind:
        const: sensor
    required:
    - kind
    - id
    type: object
  RequireStep:
    additionalProperties: false
    properties:
      command:
        description: Shell invocation (sh -c). MUST be idempotent.
        type: string
      exit_code_map:
        items:
          $ref: '#/$defs/ExitCodeMapEntry'
        minItems: 1
        type: array
      kind:
        const: step
      timeout_ms:
        description: Hard cap; falls back to cost.latency.timeout_ms when omitted.
        minimum: 1
        type: integer
    required:
    - kind
    - command
    type: object
  RequireTool:
    additionalProperties: false
    properties:
      kind:
        const: tool
      name:
        type: string
    required:
    - kind
    - name
    type: object
  Requirement:
    oneOf:
    - $ref: '#/$defs/RequireSensor'
    - $ref: '#/$defs/RequireTool'
    - $ref: '#/$defs/RequireEnv'
    - $ref: '#/$defs/RequireContext'
    - $ref: '#/$defs/RequirePermission'
    - $ref: '#/$defs/RequireStep'
  Signal:
    $ref: signal.yaml
$id: https://harness-framework/schemas/sensor.yaml
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
allOf:
- if:
    properties:
      type:
        const: computational
    required:
    - type
  then:
    properties:
      cost:
        not:
          required:
          - tokens
        required:
        - compute
      execution:
        not:
          anyOf:
          - required:
            - model
          - required:
            - system_prompt
          - required:
            - user_prompt_template
          - required:
            - decoding
- if:
    allOf:
    - properties:
        type:
          const: computational
      required:
      - type
    - properties:
        execution:
          required:
          - command
      required:
      - execution
  then:
    properties:
      execution:
        required:
        - command
        - exit_code_map
- if:
    properties:
      type:
        const: inferential
    required:
    - type
  then:
    properties:
      cost:
        not:
          required:
          - compute
        required:
        - tokens
    required:
    - calibration
- if:
    allOf:
    - properties:
        type:
          const: inferential
      required:
      - type
    - properties:
        execution:
          required:
          - command
      required:
      - execution
  then:
    properties:
      execution:
        required:
        - command
        - model
        - system_prompt
        - user_prompt_template
        - decoding
- if:
    properties:
      output:
        const: single
    required:
    - output
  then:
    properties:
      execution:
        not:
          required:
          - output_parsing
- if:
    allOf:
    - properties:
        output:
          const: stream
      required:
      - output
    - properties:
        execution:
          required:
          - command
      required:
      - execution
  then:
    properties:
      execution:
        required:
        - output_parsing
- if:
    not:
      properties:
        execution:
          properties:
            blocking:
              const: true
          required:
          - blocking
      required:
      - execution
  then:
    properties:
      cost:
        properties:
          latency:
            required:
            - timeout_ms
- if:
    properties:
      execution:
        properties:
          blocking:
            const: true
        required:
        - blocking
    required:
    - execution
  then:
    properties:
      cost:
        properties:
          latency:
            not:
              required:
              - timeout_ms
      output:
        const: stream
description: 'Definition of a harness sensor (feedback control). A sensor observes
  the system AFTER the agent acts and produces a Signal optimized for self-correction.
  Every runtime invocation of a sensor matching this schema MUST emit an output that
  conforms to schemas/signal.yaml — referenced here as #/$defs/Signal so tooling can
  resolve the output contract via chained $ref. References: Boeckeler, ''Harness Engineering''
  (martinfowler.com); Lopopolo, ''Harness engineering: leveraging Codex…'' (openai.com,
  2026-02-11).'
properties:
  blind_spots:
    description: Explicit limits — bug classes, inputs that produce unstable verdicts,
      sensor interactions that mask issues. Required honesty for inferential sensors.
    items:
      type: string
    type: array
  calibration:
    additionalProperties: false
    description: REQUIRED when sensor.type=inferential. Captures the confidence threshold
      and drift policy.
    properties:
      calibration_date:
        format: date
        type: string
      calibration_set:
        description: Path or URI to labelled fixtures used to choose the threshold.
        type: string
      calibration_size:
        minimum: 1
        type: integer
      confidence_threshold:
        description: Below this threshold, the harness MUST downgrade fail → warn.
        maximum: 1
        minimum: 0
        type: number
      drift_check_cadence:
        description: Cron expression or human-readable cadence for re-running golden
          fixtures.
        type: string
    required:
    - confidence_threshold
    - calibration_set
    - calibration_size
    - calibration_date
    type: object
  cost:
    additionalProperties: false
    properties:
      class:
        description: cheap → safe to run on every change; expensive → gate behind
          upstream PASS or schedule.
        enum:
        - cheap
        - medium
        - expensive
        type: string
      compute:
        additionalProperties: false
        description: Required when sensor.type = computational. MUST be omitted when
          sensor.type = inferential.
        properties:
          cpu:
            enum:
            - low
            - medium
            - high
            type: string
          memory_mb:
            minimum: 1
            type: integer
        required:
        - cpu
        - memory_mb
        type: object
      guardrails:
        additionalProperties: false
        description: What the harness does when cost budgets are exceeded.
        properties:
          fallback_sensor:
            description: id of a cheaper sensor to delegate to. null disables downgrade.
            type:
            - string
            - "null"
          on_phase_mismatch:
            enum:
            - refuse
            - warn
            - allow
            type: string
          on_timeout:
            enum:
            - abort
            - downgrade
            - escalate
            type: string
          on_token_overrun:
            enum:
            - truncate-and-retry
            - downgrade
            - escalate
            type: string
        type: object
      latency:
        additionalProperties: false
        properties:
          p50_ms:
            minimum: 0
            type: integer
          p95_ms:
            minimum: 0
            type: integer
          timeout_ms:
            description: Hard cap. Sensor MUST abort and emit verdict=error past this.
            minimum: 1
            type: integer
        required:
        - p50_ms
        - p95_ms
        type: object
      monetary_estimate_usd_per_run:
        minimum: 0
        type:
        - number
        - "null"
      tokens:
        additionalProperties: false
        description: Required when sensor.type = inferential. MUST be omitted when
          sensor.type = computational.
        properties:
          input_avg:
            minimum: 0
            type: integer
          max_output:
            minimum: 1
            type: integer
          model:
            description: Provider/model id (e.g. 'anthropic/claude-sonnet-4-6').
            type: string
          output_avg:
            minimum: 0
            type: integer
        required:
        - model
        - input_avg
        - output_avg
        - max_output
        type: object
    required:
    - class
    - latency
    type: object
  description:
    description: 'One sentence: trigger condition + what is observed + regulation
      dimension.'
    type: string
  determinism:
    description: high = bit-identical reruns; medium = stable across reruns within
      tolerance; low = inferential without seed.
    enum:
    - high
    - medium
    - low
    type: string
  execution:
    additionalProperties: false
    description: Discriminated by sensor.type via the top-level allOf/if-then-else.
      Computational fields and inferential fields are mutually exclusive.
      The execution shape is itself a oneOf between the legacy `command:`
      shortcut and the typed `steps:` array (see oneOf below).
    oneOf:
    - not:
        required:
        - steps
      required:
      - command
    - not:
        required:
        - command
      required:
      - steps
    properties:
      blocking:
        default: false
        description: When true, the sensor does not terminate on its own and must
          be invoked via /start-sensor / /stop-sensor. Forbids cost.latency.timeout_ms;
          allows execution.graceful_timeout_ms. Other sensors may declare a blocking
          sensor via requires[kind=sensor]; the orchestrator will start (or attach
          to) the blocking dep before the dependent runs and stop it at teardown when
          no other dependent holds it.
        type: boolean
      command:
        description: Required for both sensor types. Shell invocation (passed to sh
          -c by the runner) — pipes, redirects, globs and quoted args all work. Should
          be hermetic and idempotent.
        type: string
      decoding:
        additionalProperties: false
        description: Inferential only.
        properties:
          max_tokens:
            minimum: 1
            type: integer
          seed:
            description: Set when reproducibility matters and the model supports it.
            type:
            - integer
            - "null"
          temperature:
            maximum: 2
            minimum: 0
            type: number
          top_p:
            maximum: 1
            minimum: 0
            type: number
        required:
        - temperature
        - max_tokens
        type: object
      env:
        additionalProperties:
          type: string
        description: Environment variables set during subprocess execution. Inferential
          runner additionally injects HARNESS_PROMPT with the rendered user_prompt_template.
        type: object
      exit_code_map:
        description: Maps process exit codes to verdict/severity. Required for computational
          sensors; optional for inferential (when omitted, the inferential runner
          defaults to exit 0 → pass/info, anything else → error/high). Use exit_code='*'
          as wildcard fallback.
        items:
          $ref: '#/$defs/ExitCodeMapEntry'
        minItems: 1
        type: array
      graceful_timeout_ms:
        default: 5000
        description: Time to wait between SIGTERM and SIGKILL on /stop-sensor. Applies
          only when execution.blocking is true. Minimum 100ms to ensure the process
          has a real chance to react to SIGTERM.
        minimum: 100
        type: integer
      model:
        description: Inferential only. MUST equal cost.tokens.model.
        type: string
      output_parsing:
        additionalProperties: false
        description: Structured rules for turning subprocess output lines into individual
          Signals. Applies to both computational and inferential sensors. Optional
          — when absent, only the aggregate Signal is emitted.
        properties:
          patterns:
            description: Ordered match rules. First pattern that matches a line wins.
            items:
              additionalProperties: false
              properties:
                captures:
                  additionalProperties: false
                  description: Map a Signal.evidence field to a 1-based capture-group
                    index in regex.
                  properties:
                    excerpt:
                      minimum: 1
                      type: integer
                    file:
                      minimum: 1
                      type: integer
                    line_end:
                      minimum: 1
                      type: integer
                    line_start:
                      minimum: 1
                      type: integer
                    rationale:
                      minimum: 1
                      type: integer
                  type: object
                regex:
                  description: Go regexp (RE2).
                  type: string
                severity:
                  $ref: signal.yaml#/$defs/Severity
                verdict:
                  $ref: signal.yaml#/$defs/Verdict
              required:
              - regex
              - verdict
              - severity
              type: object
            minItems: 1
            type: array
        required:
        - patterns
        type: object
      steps:
        description: 'Typed execution pipeline (shell / http / assert / sensor).
          Mutually exclusive with execution.command via the oneOf gate. When
          steps[] is declared, output_parsing is forbidden — line-by-line
          parsing is declared per shell step under its own parse: block.'
        items:
          $ref: '#/$defs/Step'
        minItems: 1
        type: array
      system_prompt:
        description: Inferential only. Role-defining system message, no example contamination.
        type: string
      teardown:
        default: []
        description: Silent shell commands run AFTER execution.command with finally
          semantics — they run on prepare failure, command failure, and command timeout.
          Per-step results are folded into metadata.lifecycle.teardown; teardown failures
          contribute warn evidence but do NOT downgrade the aggregate verdict.
        items:
          $ref: '#/$defs/LifecycleStep'
        type: array
      user_prompt_template:
        description: Inferential only. Template with {{slots}}; demands a single JSON
          object conforming to the Signal schema.
        type: string
    type: object
  id:
    description: Stable kebab-case slug. Used verbatim as Signal.sensor_id.
    pattern: ^[a-z][a-z0-9-]*$
    type: string
  kind:
    description: Sensor category. observation = observes behavior with no fixed expectation
      (run-project, fetch-logs, fetch-metrics, trace-request, watch-build); verdict
      describes the health of the observation. assertion = checks against an expectation
      (unit-test, integration-test, e2e-test, lint, type-check, build, schema-validate);
      verdict pass/fail is semantic. setup = idempotent auxiliary sensor that makes
      a precondition true (start-postgres, setup-env-from-example, install-deps-pnpm,
      login-gcloud); typically referenced via requires[kind=sensor]. Metadata only
      — the runner treats all three identically; tooling (detect-sensors, listings)
      uses it to classify and name.
    enum:
    - observation
    - assertion
    - setup
    type: string
  name:
    description: Human-readable name.
    type: string
  output:
    description: How many Signals one invocation emits. single = exactly one Signal
      carrying the final verdict (the runner ignores subprocess stdout/stderr lines
      beyond exit code). stream = one Signal per matched output line plus one final
      aggregate Signal (JSONL on stdout). single forbids execution.output_parsing;
      stream requires it.
    enum:
    - single
    - stream
    type: string
  phase:
    description: Lifecycle stage at which the sensor is invoked.
    enum:
    - pre-commit
    - pre-merge
    - post-integration
    - continuous
    - on-demand
    type: string
  references:
    description: Source articles, ADRs, design docs justifying this sensor.
    items:
      type: string
    type: array
  regulation:
    description: Which dimension of the codebase this sensor regulates (Boeckeler/Fowler
      taxonomy).
    enum:
    - maintainability
    - architecture-fitness
    - behaviour
    type: string
  requires:
    default: []
    description: 'Preconditions for this sensor. Array of discriminated-union items
      keyed by `kind` (one of: sensor, tool, env, context, permission, step).'
    items:
      $ref: '#/$defs/Requirement'
    type: array
  self_correction:
    additionalProperties: false
    description: How the harness consumes this sensor's Signal.
    properties:
      escalation:
        description: Free-form criteria for human escalation (e.g. 'confidence < 0.6
          OR 3 consecutive fails without verdict change').
        type: string
      max_retries:
        default: 0
        minimum: 0
        type: integer
      on_error:
        default: retry-once
        enum:
        - retry-once
        - skip
        - escalate
        type: string
      on_fail:
        default: retry
        enum:
        - retry
        - block
        - advise
        type: string
      on_warn:
        default: surface
        enum:
        - surface
        - ignore
        type: string
    type: object
  triggers:
    items:
      additionalProperties: false
      allOf:
      - if:
          properties:
            "on":
              const: cron
          required:
          - "on"
        then:
          required:
          - cadence
      properties:
        cadence:
          description: Cron expression. REQUIRED when on=cron.
          type: string
        "on":
          enum:
          - pull-request
          - file-change
          - cron
          - metric-anomaly
          - manual
          - agent-request
          type: string
        when:
          description: Condition or glob (e.g. 'diff touches **/*.ts').
          type: string
      required:
      - "on"
      type: object
    minItems: 1
    type: array
  type:
    description: Execution nature. computational = deterministic, CPU-bound, fast,
      cheap (linters, type checkers, structural tests, fixed-threshold log/metric
      queries). inferential = probabilistic, GPU/NPU-bound, slow, expensive (LLM-as-judge,
      semantic-duplicate detection, AI code review, anomaly classification).
    enum:
    - computational
    - inferential
    type: string
  verification:
    additionalProperties: false
    description: Sensors are code; they need their own harness. Each sensor MUST declare
      at least one golden case.
    properties:
      golden_cases:
        items:
          additionalProperties: false
          properties:
            expected_severity:
              $ref: signal.yaml#/$defs/Severity
            expected_verdict:
              $ref: signal.yaml#/$defs/Verdict
            fixture:
              description: Path to fixture or fixture id.
              type: string
            notes:
              type: string
          required:
          - fixture
          - expected_verdict
          - expected_severity
          type: object
        minItems: 1
        type: array
      self_test_command:
        description: Command that runs all fixtures and validates each emitted Signal
          against signal.yaml.
        type: string
    required:
    - golden_cases
    type: object
  version:
    description: SemVer of the sensor definition. Bump on contract changes.
    pattern: ^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$
