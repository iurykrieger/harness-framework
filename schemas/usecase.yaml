$defs:
  Behavior:
    additionalProperties: false
    properties:
      business_rules:
        items:
          type: string
        type: array
      summary:
        type: string
    required:
    - summary
    type: object
  FixtureRef:
    description: |
      Source of the fixture payload. Exactly one of `ref` (path under
      <project>/.harness/fixtures/) or `inline` (literal value). `ref` is
      the preferred form for any structured payload; `inline` is reserved
      for primitive envelopes that don't benefit from being on disk.
    oneOf:
      - additionalProperties: false
        properties:
          ref:
            type: string
            minLength: 1
        required: [ref]
      - additionalProperties: false
        properties:
          inline: {}
        required: [inline]
  Evidence:
    additionalProperties: false
    properties:
      file:
        type: string
      kind:
        default: implementation
        description: |
          Role this evidence row plays for the UseCase. `implementation` points at the
          code that implements the variation (handler, service, domain logic) — the
          default for most rows. `contract` points at the typed declaration that
          determines the field names of trigger.fixture or expected_outcome.fixture
          (DTO classes, JSON/Zod/Joi schemas, Pydantic models, struct definitions with
          JSON tags, OpenAPI components, CLI flag/Cobra command definitions, message
          schemas). At least one `kind: contract` row is required whenever
          trigger.fixture or expected_outcome.fixture is a non-primitive value — the
          write-usecase validator rejects drafts that omit it.
        enum:
        - implementation
        - contract
        type: string
      line_end:
        minimum: 1
        type:
        - integer
        - "null"
      line_start:
        minimum: 1
        type:
        - integer
        - "null"
      rationale:
        type: string
    required:
    - file
    - rationale
    type: object
  ExpectedOutcome:
    additionalProperties: false
    properties:
      fixture:
        $ref: '#/$defs/FixtureRef'
      invariants:
        items:
          type: string
        type: array
      shape:
        type: string
      side_effects:
        items:
          type: string
        type: array
      summary:
        type: string
    required:
    - summary
    - shape
    - fixture
    type: object
  Trigger:
    additionalProperties: false
    properties:
      fixture:
        $ref: '#/$defs/FixtureRef'
      preconditions:
        items:
          type: string
        type: array
      shape:
        type: string
      summary:
        type: string
    required:
    - summary
    - shape
    - fixture
    type: object
$id: https://harness-framework/schemas/usecase.yaml
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: 'An observable journey variation of the project: one concrete input shape,
  one expected behavior, one expected outcome. Produced by /detect-usecases; consumed
  by /create-sensor to synthesize deterministic regression sensors.'
properties:
  behavior:
    $ref: '#/$defs/Behavior'
  blind_spots:
    items:
      type: string
    type: array
  description:
    type: string
  evidence:
    items:
      $ref: '#/$defs/Evidence'
    minItems: 1
    type: array
  expected_outcome:
    $ref: '#/$defs/ExpectedOutcome'
  id:
    pattern: ^[a-z][a-z0-9-]*$
    type: string
  journey_id:
    pattern: ^[a-z][a-z0-9-]*$
    type: string
  name:
    type: string
  references:
    items:
      type: string
    type: array
  regression_priority:
    enum:
    - critical
    - high
    - medium
    - low
    type: string
  tags:
    items:
      type: string
    type: array
  trigger:
    $ref: '#/$defs/Trigger'
  version:
    pattern: ^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$
    type: string
required:
- id
- version
- name
- description
- journey_id
- trigger
- behavior
- expected_outcome
- evidence
title: UseCase
type: object
